# A document that ties the parts together: the platform, the package, its
# source, and the attestations about one release.
build_platforms:
  - builder_id: https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v1.9.0
    build_level: SLSA_BUILD_LEVEL_3
    hosted: true
control_planes:
  - build_platform: https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v1.9.0
parties:
  - party_type: SlsaProducer
    party_name: Example project maintainers
    build_platform: https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@refs/tags/v1.9.0
  - party_type: SlsaConsumer
    party_name: Example Corp platform engineering
  - party_type: SlsaVerifier
    verifier_id: https://github.com/slsa-framework/slsa-verifier
  - party_type: SlsaInfrastructureProvider
    party_name: GitHub
package_registries:
  - registry_uri: https://pypi.org/simple/
    ecosystem: PyPA
packages:
  - package_name: myapp
    ecosystem: PyPA
    registry: https://pypi.org/simple/
    package_artifacts:
      - resource_uri: pkg:pypi/myapp@1.0.0
        digest:
          sha256: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
source_control_systems:
  - scs_uri: https://github.com
source_repositories:
  - repository_uri: https://github.com/example/myapp
    hosted_by: https://github.com
source_revisions:
  - revision_id: abc123def456abc123def456abc123def456abc1
    repository: https://github.com/example/myapp
  - revision_id: da39a3ee5e6b4b0d3255bfef95601890afd80709
    repository: https://github.com/example/myapp
    authored_by: developer@example.com
    authored_at: "2024-01-15T09:00:00Z"
    parent_revisions:
      - abc123def456abc123def456abc123def456abc1
    source_level: SLSA_SOURCE_LEVEL_3
    review_type: TWO_PARTY
named_references:
