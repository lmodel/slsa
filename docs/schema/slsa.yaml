    from_schema: https://w3id.org/lmodel/slsa/slsa_build
    slot_uri: slsa:invocation_id
    alias: invocation_id
    owner: SlsaBuildMetadata
    domain_of:
    - SlsaBuildMetadata
    range: string
  slsaBuildMetadata__started_on:
    name: slsaBuildMetadata__started_on
    description: When the build started.
    from_schema: https://w3id.org/lmodel/slsa/slsa_build
