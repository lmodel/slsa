    from_schema: https://w3id.org/lmodel/slsa/slsa_build
    slot_uri: slsa:build_definition
    alias: build_definition
    owner: SlsaBuildProvenance
    domain_of:
    - SlsaBuildProvenance
    range: SlsaBuildDefinition
    required: true
    inlined: true
    inlined_as_list: true
  slsaBuildProvenance__run_details:
    name: slsaBuildProvenance__run_details
    description: What is specific to this execution of the build; required at Build
      L1.
