    - SlsaBuildProvenance
    range: SlsaRunDetails
    required: true
    inlined: true
    inlined_as_list: true
  slsaBuildDefinition__build_type:
    name: slsaBuildDefinition__build_type
    description: The URI of the template that says how to run the build and read its
      parameters and dependencies; required at Build L1.
    from_schema: https://w3id.org/lmodel/slsa/slsa_build
    slot_uri: slsa:build_type
    alias: build_type
    owner: SlsaBuildDefinition
    domain_of:
    - SlsaBuildDefinition
    range: uri
    required: true
  slsaBuildDefinition__external_parameters:
    name: slsaBuildDefinition__external_parameters
    description: The inputs under the tenant's control; complete at Build L3 and verified
      by consumers.
    comments:
    - Verifiers reject parameters they do not recognize here.
    from_schema: https://w3id.org/lmodel/slsa/slsa_build
    slot_uri: slsa:external_parameters
    alias: external_parameters
    owner: SlsaBuildDefinition
    domain_of:
    - SlsaBuildDefinition
    range: SlsaBuildParameter
    multivalued: true
    inlined: true
    inlined_as_list: true
  slsaBuildDefinition__internal_parameters:
    name: slsaBuildDefinition__internal_parameters
    description: The inputs the platform sets itself; kept for debugging, incident
      response and reproduction, and not verified by consumers.
    from_schema: https://w3id.org/lmodel/slsa/slsa_build
    slot_uri: slsa:internal_parameters
    alias: internal_parameters
    owner: SlsaBuildDefinition
    domain_of:
    - SlsaBuildDefinition
    range: SlsaBuildParameter
    multivalued: true
    inlined: true
    inlined_as_list: true
  slsaBuildDefinition__resolved_dependencies:
    name: slsaBuildDefinition__resolved_dependencies
    description: The artifacts fetched during the build, as far as the platform knows
      them; completeness is best effort through Build L3.
    from_schema: https://w3id.org/lmodel/slsa/slsa_build
    slot_uri: slsa:resolved_dependencies
    alias: resolved_dependencies
    owner: SlsaBuildDefinition
    domain_of:
    - SlsaBuildDefinition
    range: InTotoResourceDescriptor
    multivalued: true
    inlined: true
    inlined_as_list: true
  slsaBuildDefinition__hermetic:
    name: slsaBuildDefinition__hermetic
    description: Whether the build could reach only the dependencies it declared,
      with no other network or filesystem access.
    comments:
    - Hermetic builds are an isolation property Build L3 platforms aim for, and the
      one practitioners found hardest (Tamanna et al., 2024, CI.1).
    in_subset:
    - slsa_adoption_study
    from_schema: https://w3id.org/lmodel/slsa/slsa_build
    slot_uri: slsa:hermetic
    alias: hermetic
    owner: SlsaBuildDefinition
    domain_of:
    - SlsaBuildDefinition
    range: boolean
  slsaBuildDefinition__provenance_generation_tool:
    name: slsaBuildDefinition__provenance_generation_tool
    description: The tool that generated this provenance, named by URI.
    comments:
    - Naming the generator supports the strategy of standardizing provenance generation
      (Tamanna et al., 2024, S3.1).
    in_subset:
    - slsa_adoption_study
    from_schema: https://w3id.org/lmodel/slsa/slsa_build
    slot_uri: slsa:provenance_generation_tool
    alias: provenance_generation_tool
    owner: SlsaBuildDefinition
    domain_of:
    - SlsaBuildDefinition
    range: uri
  slsaBuildDefinition__pipeline_orchestrator:
    name: slsaBuildDefinition__pipeline_orchestrator
    description: The CI/CD system that coordinated the build, named by URI, where
      it differs from the builder.
    comments:
    - In the Secure Software Factory architecture this is the Build Service layer,
      distinct from the provenance-generating builder.
    in_subset:
    - slsa_ssf
    from_schema: https://w3id.org/lmodel/slsa/slsa_build
    slot_uri: slsa:pipeline_orchestrator
    alias: pipeline_orchestrator
    owner: SlsaBuildDefinition
    domain_of:
    - SlsaBuildDefinition
    range: uri
