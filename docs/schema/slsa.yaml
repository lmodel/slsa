    name: SlsaDocument
    definition_uri: https://w3id.org/lmodel/slsa/SlsaDocument
    description: A document that holds SLSA attestations and the parties, platforms,
      packages, repositories and images they concern.
    from_schema: https://w3id.org/lmodel/slsa
    slots:
    - slsaDocument__attestations
    - slsaDocument__parties
    - slsaDocument__build_platforms
    - slsaDocument__packages
    - slsaDocument__package_registries
    - slsaDocument__source_control_systems
    - slsaDocument__source_repositories
    - slsaDocument__source_revisions
    - slsaDocument__named_references
    - slsaDocument__build_images
    - slsaDocument__dependency_inventories
    - slsaDocument__adoption_metadata
    attributes:
      attestations:
        name: attestations
        description: The attestations, as in-toto statements.
        range: InTotoStatement
        multivalued: true
        inlined: true
        inlined_as_list: true
      parties:
        name: parties
        description: The parties, each in its role.
        range: SlsaParty
        multivalued: true
        inlined: true
        inlined_as_list: true
      build_platforms:
        name: build_platforms
        description: The build platforms.
        range: SlsaBuildPlatform
        multivalued: true
        inlined: true
        inlined_as_list: true
      packages:
        name: packages
        description: The packages.
        range: SlsaPackage
        multivalued: true
        inlined: true
        inlined_as_list: true
      package_registries:
        name: package_registries
        description: The package registries.
        range: SlsaPackageRegistry
        multivalued: true
        inlined: true
        inlined_as_list: true
      source_control_systems:
        name: source_control_systems
        description: The source control systems.
        range: SlsaSourceControlSystem
        multivalued: true
        inlined: true
        inlined_as_list: true
      source_repositories:
        name: source_repositories
        description: The source repositories.
        range: SlsaSourceRepository
        multivalued: true
        inlined: true
        inlined_as_list: true
      source_revisions:
        name: source_revisions
        description: The source revisions.
        range: SlsaSourceRevision
        multivalued: true
        inlined: true
        inlined_as_list: true
      named_references:
        name: named_references
        description: The branches and tags.
        range: SlsaNamedReference
        multivalued: true
        inlined: true
        inlined_as_list: true
      build_images:
        name: build_images
        description: The build images.
        range: SlsaBuildImage
        multivalued: true
        inlined: true
        inlined_as_list: true
      dependency_inventories:
        name: dependency_inventories
        description: The dependency inventories.
        range: SlsaDependencyInventory
        multivalued: true
        inlined: true
        inlined_as_list: true
      adoption_metadata:
        name: adoption_metadata
        description: How the deployment the document describes fares against the adoption
          study's themes.
        range: SlsaAdoptionMetadata
        inlined: true
    class_uri: slsa:SlsaDocument
    tree_root: true
  InTotoDigestSet:
    name: InTotoDigestSet
    definition_uri: https://w3id.org/lmodel/slsa/InTotoDigestSet
    description: A set of digests over one artifact, keyed by algorithm, from which
      a consumer picks the algorithm it trusts.
    comments:
    - Digests are lowercase hexadecimal. The in-toto framework defines more algorithms
      than the five modelled here.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    see_also:
    - https://github.com/in-toto/attestation/blob/main/spec/v1/digest_set.md
    slots:
    - inTotoDigestSet__sha256
    - inTotoDigestSet__sha512
    - inTotoDigestSet__git_commit
    - inTotoDigestSet__git_tree
    - inTotoDigestSet__dir_hash
    attributes:
      sha256:
        name: sha256
        description: The SHA-256 digest of the artifact.
        pattern: ^[a-f0-9]{64}$
      sha512:
        name: sha512
        description: The SHA-512 digest of the artifact.
        pattern: ^[a-f0-9]{128}$
      git_commit:
        name: git_commit
        description: The git commit id of a source revision.
        pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
      git_tree:
        name: git_tree
        description: The git tree id of a source revision's content.
        pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
      dir_hash:
        name: dir_hash
        description: A digest over a directory's content, as the in-toto framework
          defines it.
    class_uri: slsa:InTotoDigestSet
  InTotoAnnotation:
    name: InTotoAnnotation
    definition_uri: https://w3id.org/lmodel/slsa/InTotoAnnotation
    description: One vendor-specific annotation on a resource descriptor, with a key
      and one or more values.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    slots:
    - inTotoAnnotation__annotation_key
    - inTotoAnnotation__annotation_values
    attributes:
      annotation_key:
        name: annotation_key
        description: The annotation's key.
        required: true
      annotation_values:
        name: annotation_values
        description: The annotation's values.
        multivalued: true
    class_uri: slsa:InTotoAnnotation
  InTotoResourceDescriptor:
    name: InTotoResourceDescriptor
    definition_uri: https://w3id.org/lmodel/slsa/InTotoResourceDescriptor
    description: A reference to a software artifact or other resource, by URI, by
      digest, or both, with optional metadata.
    comments:
    - A descriptor needs a URI, a digest or both; which one a field requires is said
      on that field.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    - slsa_dependency_track
    - slsa_build_environment_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    see_also:
    - https://github.com/in-toto/attestation/blob/main/spec/v1/resource_descriptor.md
    slots:
    - resource_uri
    - digest
    - inTotoResourceDescriptor__resource_name
    - inTotoResourceDescriptor__download_location
    - inTotoResourceDescriptor__media_type
    - inTotoResourceDescriptor__annotations
    attributes:
      resource_name:
        name: resource_name
        description: A name for the resource within the attestation that carries it.
      download_location:
        name: download_location
        description: Where the resource can be fetched, when that differs from its
          identifying URI.
        range: uri
      media_type:
        name: media_type
        description: The IANA media type of the resource's content.
      annotations:
        name: annotations
        description: Vendor-specific annotations on the resource, such as the source
          references a Source VSA records.
        range: InTotoAnnotation
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: slsa:InTotoResourceDescriptor
  InTotoStatement:
    name: InTotoStatement
    definition_uri: https://w3id.org/lmodel/slsa/InTotoStatement
    description: 'The statement layer of an in-toto attestation: the subjects it is
      about, the type of its predicate and the predicate itself.'
    comments:
    - The signature envelope around a statement is outside this model.
    - Attestation and provenance are often confused; a statement is the attestation,
      and build provenance is one kind of predicate it may carry (Tamanna et al.,
      2024, UC.1).
    in_subset:
    - slsa_build_track
    - slsa_source_track
    - slsa_build_environment_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    see_also:
    - https://github.com/in-toto/attestation/blob/main/spec/v1/statement.md
    - https://slsa.dev/spec/v1.2/attestation-model
    slots:
    - inTotoStatement__statement_type
    - inTotoStatement__subject
    - inTotoStatement__predicate_type
    - inTotoStatement__predicate
    - inTotoStatement__attestation_storage_uri
    - inTotoStatement__signing_tool
    - inTotoStatement__transparency_log_entry
    attributes:
      statement_type:
        name: statement_type
        description: The in-toto statement type, always https://in-toto.io/Statement/v1.
        range: uri
        required: true
        pattern: ^https://in-toto\.io/Statement/v1$
      subject:
        name: subject
        description: The artifacts the predicate is about; each carries a digest.
        range: InTotoResourceDescriptor
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
      predicate_type:
        name: predicate_type
        description: The URI that names the predicate's type and so its schema, such
          as https://slsa.dev/provenance/v1.
        range: uri
        required: true
      predicate:
        name: predicate
        description: The predicate, one of the kinds this schema models; predicate_kind
          names which.
        range: SlsaPredicate
        inlined: true
      attestation_storage_uri:
        name: attestation_storage_uri
        description: Where the signed attestation is stored or can be fetched.
        comments:
        - SLSA names no standard place to store attestations; recording the place
          used helps consumers find them (Tamanna et al., 2024, LF.1).
        in_subset:
        - slsa_adoption_study
        range: uri
      signing_tool:
        name: signing_tool
        description: The tool that signed the attestation, named by URI, such as Cosign
          or Notation.
        in_subset:
        - slsa_ssf
        range: uri
      transparency_log_entry:
        name: transparency_log_entry
        description: The transparency log entry that records the signature, such as
          a Rekor entry.
        in_subset:
        - slsa_ssf
        range: uri
    class_uri: slsa:InTotoStatement
  SlsaPredicate:
    name: SlsaPredicate
    definition_uri: https://w3id.org/lmodel/slsa/SlsaPredicate
    description: The base of every predicate this schema models; predicate_kind names
      the concrete kind.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    - slsa_build_environment_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    abstract: true
    slots:
    - slsaPredicate__predicate_kind
    attributes:
      predicate_kind:
        name: predicate_kind
        description: The kind of predicate, one of this class's descendants.
        designates_type: true
        range: string
    class_uri: slsa:SlsaPredicate
  SlsaParty:
    name: SlsaParty
    definition_uri: https://w3id.org/lmodel/slsa/SlsaParty
    description: A person or organization that takes part in a software supply chain,
      in one of the roles SLSA names.
    comments:
    - One party may act in several roles, and several parties may share one role.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    see_also:
    - https://slsa.dev/spec/v1.2/terminology#roles
    abstract: true
    slots:
    - slsaParty__party_type
    - slsaParty__party_name
    attributes:
      party_type:
        name: party_type
        description: The role the party acts in, one of this class's descendants.
        designates_type: true
        range: string
      party_name:
        name: party_name
        description: The party's name.
    class_uri: slsa:SlsaParty
  SlsaProducer:
    name: SlsaProducer
    definition_uri: https://w3id.org/lmodel/slsa/SlsaProducer
    description: A party that creates software and provides it to others, choosing
      a build platform and distributing provenance.
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    is_a: SlsaParty
    slots:
    - slsaParty__party_type
    - slsaParty__party_name
    - build_platform
    class_uri: slsa:SlsaProducer
  SlsaConsumer:
    name: SlsaConsumer
    definition_uri: https://w3id.org/lmodel/slsa/SlsaConsumer
    description: A party that uses software a producer provides, verifying its provenance
      itself or through a verifier.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    is_a: SlsaParty
    slots:
    - slsaParty__party_type
    - slsaParty__party_name
    class_uri: slsa:SlsaConsumer
  SlsaVerifier:
    name: SlsaVerifier
    definition_uri: https://w3id.org/lmodel/slsa/SlsaVerifier
    description: A party that inspects provenance or other attestations and decides
      whether an artifact is authentic.
    comments:
    - Consumers accept only specific signer and verifier pairs.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    see_also:
    - https://slsa.dev/spec/v1.2/verification_summary#verifier
    is_a: SlsaParty
    slots:
    - slsaParty__party_type
    - slsaParty__party_name
    - component_versions
    - slsaVerifier__verifier_id
    attributes:
      verifier_id:
        name: verifier_id
        description: The URI that identifies the verifier.
        range: uri
        required: true
    class_uri: slsa:SlsaVerifier
  SlsaInfrastructureProvider:
    name: SlsaInfrastructureProvider
    definition_uri: https://w3id.org/lmodel/slsa/SlsaInfrastructureProvider
    description: A party that provides software or services to the other roles, such
      as a package registry's or a build platform's maintainers.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    is_a: SlsaParty
    slots:
    - slsaParty__party_type
    - slsaParty__party_name
    class_uri: slsa:SlsaInfrastructureProvider
  SlsaBuildPlatform:
    name: SlsaBuildPlatform
    definition_uri: https://w3id.org/lmodel/slsa/SlsaBuildPlatform
    description: 'The system that runs builds and records their provenance: the transitive
      closure of software, hardware, people and organizations trusted to do so. Provenance
      names it as the builder.'
    comments:
    - A platform with several modes of operation at different levels has a different
      builder_id for each.
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    see_also:
    - https://slsa.dev/spec/v1.2/terminology#build-model
    - https://slsa.dev/spec/v1.2/build-provenance#builder
    slots:
    - component_versions
    - slsaBuildPlatform__builder_id
    - slsaBuildPlatform__build_level
    - slsaBuildPlatform__hosted
    - slsaBuildPlatform__builder_dependencies
    attributes:
      builder_id:
        name: builder_id
        description: The URI that identifies the platform and determines its SLSA
          Build level.
        identifier: true
        range: uri
      build_level:
        name: build_level
        description: The highest SLSA Build level the platform's provenance can meet.
        range: SlsaBuildLevel
      hosted:
        name: hosted
        description: Whether the platform is a hosted service on shared or dedicated
          infrastructure rather than an individual's workstation.
        comments:
        - Build L2 and above require a hosted platform.
        range: boolean
      builder_dependencies:
        name: builder_dependencies
        description: Dependencies of the platform's orchestrator that do not run inside
          the build but may affect provenance generation or its guarantees.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: slsa:SlsaBuildPlatform
  SlsaControlPlane:
    name: SlsaControlPlane
    definition_uri: https://w3id.org/lmodel/slsa/SlsaControlPlane
    description: The component of a build platform that orchestrates each build and
      generates its provenance, outside the tenant's control.
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    see_also:
    - https://slsa.dev/spec/v1.2/terminology#build-model
    slots:
    - build_platform
    class_uri: slsa:SlsaControlPlane
  SlsaComponentVersion:
    name: SlsaComponentVersion
    definition_uri: https://w3id.org/lmodel/slsa/SlsaComponentVersion
    description: The version of one named component of a platform.
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    slots:
    - slsaComponentVersion__component
    - slsaComponentVersion__component_version
    attributes:
      component:
        name: component
        description: The component's name.
        required: true
      component_version:
        name: component_version
        description: The component's version string.
    class_uri: slsa:SlsaComponentVersion
  SlsaPackageRegistry:
    name: SlsaPackageRegistry
    definition_uri: https://w3id.org/lmodel/slsa/SlsaPackageRegistry
    description: A distribution platform that resolves package names to immutable
      package artifacts within an ecosystem.
    in_subset:
    - slsa_build_track
    - slsa_dependency_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    see_also:
    - https://slsa.dev/spec/v1.2/terminology#distribution-model
    slots:
    - ecosystem
    - slsaPackageRegistry__registry_uri
    attributes:
      registry_uri:
        name: registry_uri
        description: The URI that identifies the registry.
        identifier: true
        range: uri
    class_uri: slsa:SlsaPackageRegistry
  SlsaPackage:
    name: SlsaPackage
    definition_uri: https://w3id.org/lmodel/slsa/SlsaPackage
    description: A unit of software distributed under a package name, which is the
      primary security boundary SLSA protects. Its artifacts are the outputs of builds.
    in_subset:
    - slsa_build_track
    - slsa_dependency_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    see_also:
    - https://slsa.dev/spec/v1.2/terminology#distribution-model
    slots:
    - ecosystem
    - slsaPackage__package_name
    - slsaPackage__registry
    - slsaPackage__package_artifacts
    - slsaPackage__guac_uri
    - slsaPackage__security_insights_uri
    attributes:
      package_name:
        name: package_name
        description: The name consumers use to obtain the package within its ecosystem
          and registry.
        required: true
      registry:
        name: registry
        description: The registry the package is published to.
        range: SlsaPackageRegistry
      package_artifacts:
        name: package_artifacts
        description: The immutable artifacts the package name has resolved to.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
      guac_uri:
        name: guac_uri
        description: Where a GUAC instance answers queries about the package's dependency
          and provenance graph.
        in_subset:
        - slsa_ssf
        range: uri
      security_insights_uri:
        name: security_insights_uri
        description: The SECURITY-INSIGHTS.yml file of the project that produces the
          package.
        in_subset:
        - slsa_ssf
        range: uri
    class_uri: slsa:SlsaPackage
  SlsaBuildProvenance:
    name: SlsaBuildProvenance
    definition_uri: https://w3id.org/lmodel/slsa/SlsaBuildProvenance
    description: The predicate that says how a build platform produced a set of artifacts,
      so that consumers can verify the build met their expectations and others can
      rebuild it.
    comments:
    - The statement that carries it has predicate_type https://slsa.dev/provenance/v1.
    - Generating valid provenance was the most frequent adoption difficulty practitioners
      reported (Tamanna et al., 2024, CI.1).
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_build
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#provenance
    is_a: SlsaPredicate
    slots:
    - slsaPredicate__predicate_kind
    - slsaBuildProvenance__build_definition
    - slsaBuildProvenance__run_details
    attributes:
      build_definition:
        name: build_definition
        description: The inputs to the build; required at Build L1.
        range: SlsaBuildDefinition
        required: true
        inlined: true
      run_details:
        name: run_details
        description: What is specific to this execution of the build; required at
          Build L1.
        range: SlsaRunDetails
        required: true
        inlined: true
    class_uri: slsa:SlsaBuildProvenance
  SlsaBuildDefinition:
    name: SlsaBuildDefinition
    definition_uri: https://w3id.org/lmodel/slsa/SlsaBuildDefinition
    description: The inputs to a build, in enough detail to initialize it and begin
      execution; the builder vouches for their accuracy.
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_build
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#builddefinition
    slots:
    - slsaBuildDefinition__build_type
    - slsaBuildDefinition__external_parameters
    - slsaBuildDefinition__internal_parameters
    - slsaBuildDefinition__resolved_dependencies
    - slsaBuildDefinition__hermetic
    - slsaBuildDefinition__provenance_generation_tool
    - slsaBuildDefinition__pipeline_orchestrator
    attributes:
      build_type:
        name: build_type
        description: The URI of the template that says how to run the build and read
          its parameters and dependencies; required at Build L1.
        range: uri
        required: true
      external_parameters:
        name: external_parameters
        description: The inputs under the tenant's control; complete at Build L3 and
          verified by consumers.
        comments:
        - Verifiers reject parameters they do not recognize here.
        range: SlsaBuildParameter
        multivalued: true
        inlined: true
        inlined_as_list: true
      internal_parameters:
        name: internal_parameters
        description: The inputs the platform sets itself; kept for debugging, incident
          response and reproduction, and not verified by consumers.
        range: SlsaBuildParameter
        multivalued: true
        inlined: true
        inlined_as_list: true
      resolved_dependencies:
        name: resolved_dependencies
        description: The artifacts fetched during the build, as far as the platform
          knows them; completeness is best effort through Build L3.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
      hermetic:
        name: hermetic
        description: Whether the build could reach only the dependencies it declared,
          with no other network or filesystem access.
        comments:
        - Hermetic builds are an isolation property Build L3 platforms aim for, and
          the one practitioners found hardest (Tamanna et al., 2024, CI.1).
        in_subset:
        - slsa_adoption_study
        range: boolean
      provenance_generation_tool:
        name: provenance_generation_tool
        description: The tool that generated this provenance, named by URI.
        comments:
        - Naming the generator supports the strategy of standardizing provenance generation
          (Tamanna et al., 2024, S3.1).
        in_subset:
        - slsa_adoption_study
        range: uri
      pipeline_orchestrator:
        name: pipeline_orchestrator
        description: The CI/CD system that coordinated the build, named by URI, where
          it differs from the builder.
        comments:
        - In the Secure Software Factory architecture this is the Build Service layer,
          distinct from the provenance-generating builder.
        in_subset:
        - slsa_ssf
        range: uri
    class_uri: slsa:SlsaBuildDefinition
  SlsaBuildParameter:
    name: SlsaBuildParameter
    definition_uri: https://w3id.org/lmodel/slsa/SlsaBuildParameter
    description: One named input to a build, with a string value.
    comments:
    - The specification recommends string values; a structured value is written as
      its JSON text.
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_build
    slots:
    - slsaBuildParameter__parameter_name
    - slsaBuildParameter__parameter_value
    attributes:
      parameter_name:
        name: parameter_name
        description: The parameter's name.
        required: true
      parameter_value:
        name: parameter_value
        description: The parameter's value.
    class_uri: slsa:SlsaBuildParameter
  SlsaRunDetails:
    name: SlsaRunDetails
    definition_uri: https://w3id.org/lmodel/slsa/SlsaRunDetails
    description: 'What is specific to one execution of a build: the platform that
      ran it, metadata about the run and its by-products.'
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_build
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#rundetails
    slots:
    - slsaRunDetails__builder
    - slsaRunDetails__build_metadata
    - slsaRunDetails__byproducts
    attributes:
      builder:
        name: builder
        description: The build platform that ran the build and is trusted to have
          written this provenance; required at Build L1.
        range: SlsaBuildPlatform
        required: true
        inlined: true
      build_metadata:
        name: build_metadata
        description: Metadata about this execution of the build.
        range: SlsaBuildMetadata
        inlined: true
      byproducts:
        name: byproducts
        description: Artifacts the build produced beside its outputs that may help
          debugging or incident response, such as logs.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: slsa:SlsaRunDetails
  SlsaBuildMetadata:
    name: SlsaBuildMetadata
    definition_uri: https://w3id.org/lmodel/slsa/SlsaBuildMetadata
    description: 'Metadata about one execution of a build: its identifier and when
      it started and finished.'
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_build
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#buildmetadata
    slots:
    - slsaBuildMetadata__invocation_id
    - slsaBuildMetadata__started_on
    - slsaBuildMetadata__finished_on
    attributes:
      invocation_id:
        name: invocation_id
        description: An identifier for this build invocation, in a format the builder
          defines; useful for finding its logs.
      started_on:
        name: started_on
        description: When the build started.
        range: datetime
      finished_on:
        name: finished_on
        description: When the build finished.
        range: datetime
    class_uri: slsa:SlsaBuildMetadata
  SlsaVerificationSummary:
    name: SlsaVerificationSummary
    definition_uri: https://w3id.org/lmodel/slsa/SlsaVerificationSummary
    description: The predicate in which a verifier records that it evaluated artifacts
      against a policy and the SLSA levels they met, so consumers can rely on the
      verifier instead of reading every underlying attestation.
    comments:
    - The statement that carries it has predicate_type https://slsa.dev/verification_summary/v1.
    - A Source VSA is this predicate with the repository as resource_uri and the revision
      id in the subject's digest.
    - Verification tooling and the places attestations are stored were an adoption
      difficulty practitioners reported (Tamanna et al., 2024, LF.1).
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_verification
    see_also:
    - https://slsa.dev/spec/v1.2/verification_summary
    - https://slsa.dev/spec/v1.2/source-requirements#source-verification-summary-attestation
    is_a: SlsaPredicate
    slots:
    - slsaPredicate__predicate_kind
    - SlsaVerificationSummary_resource_uri
    - slsaVerificationSummary__verifier
    - slsaVerificationSummary__time_verified
    - slsaVerificationSummary__policy
    - slsaVerificationSummary__input_attestations
    - slsaVerificationSummary__verification_result
    - slsaVerificationSummary__verified_levels
    - slsaVerificationSummary__organization_properties
    - slsaVerificationSummary__dependency_levels
    - slsaVerificationSummary__slsa_version
    slot_usage:
      resource_uri:
        name: resource_uri
        description: The URI consumers fetch the artifact from, which the verifier
          verified it as.
        required: true
    attributes:
      verifier:
        name: verifier
        description: The verifier that made this determination.
        range: SlsaVerifier
        required: true
        inlined: true
      time_verified:
        name: time_verified
        description: When the verification happened.
        range: datetime
      policy:
        name: policy
        description: The policy the subject was verified against, by URI and preferably
          by digest too.
        range: InTotoResourceDescriptor
        required: true
        inlined: true
      input_attestations:
        name: input_attestations
        description: Every attestation the verifier consulted, each with a digest;
          complete when present.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
      verification_result:
        name: verification_result
        description: Whether the subject passed the policy.
        range: SlsaVerificationResult
        required: true
      verified_levels:
        name: verified_levels
        description: The highest level verified in each track, and any verified property;
          a level implies the levels below it.
        range: SlsaResult
        required: true
        multivalued: true
      organization_properties:
        name: organization_properties
        description: Properties an organization defines for its own consumers, each
          prefixed ORG_SOURCE_.
        in_subset:
        - slsa_source_track
        multivalued: true
        pattern: ^ORG_SOURCE_
      dependency_levels:
        name: dependency_levels
        description: How many transitive dependencies were verified at each level;
          absent when the verifier makes no claim about dependencies.
        range: SlsaDependencyLevelCount
        multivalued: true
        inlined: true
        inlined_as_list: true
      slsa_version:
        name: slsa_version
        description: The SLSA specification version the verifier applied, as MAJOR.MINOR.
        pattern: ^[0-9]+\.[0-9]+$
    class_uri: slsa:SlsaVerificationSummary
  SlsaDependencyLevelCount:
    name: SlsaDependencyLevelCount
    definition_uri: https://w3id.org/lmodel/slsa/SlsaDependencyLevelCount
    description: The number of an artifact's transitive dependencies verified at one
      level, each counted once per track at its highest level.
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_verification
    slots:
    - slsaDependencyLevelCount__verified_level
    - slsaDependencyLevelCount__dependency_count
    attributes:
      verified_level:
        name: verified_level
        description: The level the dependencies were verified at.
        range: SlsaResult
        required: true
      dependency_count:
        name: dependency_count
        description: How many dependencies were verified at that level.
        range: integer
        required: true
        minimum_value: 0
    class_uri: slsa:SlsaDependencyLevelCount
  SlsaSourceControlSystem:
    name: SlsaSourceControlSystem
    definition_uri: https://w3id.org/lmodel/slsa/SlsaSourceControlSystem
    description: The platform or services that host a source repository and enforce
      its organization's policies on authentication, authorization and change management.
    comments:
    - The SCS issues the Source VSAs and source provenance for the revisions it hosts.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_source
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    slots:
    - slsaSourceControlSystem__scs_uri
    attributes:
      scs_uri:
        name: scs_uri
        description: The URI that identifies the source control system.
        identifier: true
        range: uri
    class_uri: slsa:SlsaSourceControlSystem
  SlsaSourceRepository:
    name: SlsaSourceRepository
    definition_uri: https://w3id.org/lmodel/slsa/SlsaSourceRepository
    description: A self-contained unit that holds a set of files, their revision history
      and metadata such as branches and tags.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_source
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    slots:
    - slsaSourceRepository__repository_uri
    - slsaSourceRepository__hosted_by
    attributes:
      repository_uri:
        name: repository_uri
        description: The stable locator the SCS gives the repository.
        identifier: true
        range: uri
      hosted_by:
        name: hosted_by
        description: The source control system that hosts the repository.
        range: SlsaSourceControlSystem
    class_uri: slsa:SlsaSourceRepository
  SlsaSourceRevision:
    name: SlsaSourceRevision
    definition_uri: https://w3id.org/lmodel/slsa/SlsaSourceRevision
    description: 'A logically immutable snapshot of a repository''s tracked files,
      with its version-control metadata: author, time and parent revisions.'
    comments:
    - A revision id is unique within its repository and may recur in another; a document
      that holds revisions from several repositories qualifies them.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_source
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    slots:
    - repository
    - slsaSourceRevision__revision_id
    - slsaSourceRevision__authored_by
    - slsaSourceRevision__authored_at
    - slsaSourceRevision__parent_revisions
    - slsaSourceRevision__source_level
    - slsaSourceRevision__review_type
    attributes:
      revision_id:
        name: revision_id
        description: The revision identifier the SCS assigns, such as a git commit
          id or a path- qualified sequence number.
        identifier: true
      authored_by:
        name: authored_by
        description: The identity of the person or automation that authored the revision.
      authored_at:
        name: authored_at
        description: When the revision was created.
        range: datetime
      parent_revisions:
        name: parent_revisions
        description: The revisions this one descends from, which together form the
          change history.
        range: SlsaSourceRevision
        multivalued: true
      source_level:
        name: source_level
        description: The SLSA Source level the SCS asserts for the revision.
        range: SlsaSourceLevel
      review_type:
        name: review_type
        description: The form of review that approved the revision.
        in_subset:
        - slsa_adoption_study
        range: SlsaReviewType
    class_uri: slsa:SlsaSourceRevision
  SlsaNamedReference:
    name: SlsaNamedReference
    definition_uri: https://w3id.org/lmodel/slsa/SlsaNamedReference
    description: A user-friendly name for a revision in a repository, such as main
      or v1.2.3; reference_type says whether it is a branch or a tag.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_source
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    slots:
    - repository
    - revision
    - slsaNamedReference__reference_type
    - slsaNamedReference__reference_name
    - slsaNamedReference__protected
    attributes:
      reference_type:
        name: reference_type
        description: The kind of named reference, one of this class's descendants.
        designates_type: true
        range: string
      reference_name:
        name: reference_name
        description: The reference's name, fully qualified in git, such as refs/heads/main.
        required: true
      protected:
        name: protected
        description: Whether the organization has the SCS enforce its technical controls
          on this reference.
        range: boolean
    class_uri: slsa:SlsaNamedReference
  SlsaBranch:
    name: SlsaBranch
    definition_uri: https://w3id.org/lmodel/slsa/SlsaBranch
    description: A named reference that moves to track a line of development.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_source
    is_a: SlsaNamedReference
    slots:
    - repository
    - revision
    - slsaNamedReference__reference_type
    - slsaNamedReference__reference_name
    - slsaNamedReference__protected
    class_uri: slsa:SlsaBranch
  SlsaTag:
    name: SlsaTag
    definition_uri: https://w3id.org/lmodel/slsa/SlsaTag
    description: A named reference meant never to move once created.
    comments:
    - A version-control tag that is allowed to move, such as latest, is a named reference
      and not a tag in this sense.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_source
    is_a: SlsaNamedReference
    slots:
    - repository
    - revision
    - slsaNamedReference__reference_type
    - slsaNamedReference__reference_name
    - slsaNamedReference__protected
    class_uri: slsa:SlsaTag
  SlsaSourceProvenance:
    name: SlsaSourceProvenance
    definition_uri: https://w3id.org/lmodel/slsa/SlsaSourceProvenance
    description: Evidence from an SCS of how a revision came to exist and which technical
      controls were enforced when it did.
    comments:
    - SLSA leaves the format of source provenance to each SCS and defines no predicate
      type for it; this class holds what the specification says such provenance conveys.
    - Source L2 and above require the SCS to issue it with each new revision.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_source
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#source-provenance-attestations
    is_a: SlsaPredicate
    slots:
    - slsaPredicate__predicate_kind
    - SlsaSourceProvenance_revision
    - slsaSourceProvenance__controls_enforced
    slot_usage:
      revision:
        name: revision
        required: true
    attributes:
      controls_enforced:
        name: controls_enforced
        description: The technical controls the SCS enforced when the revision was
          created, as the organization documents them.
        comments:
        - Two-party review is a control many single-maintainer projects cannot meet
          (Tamanna et al., 2024, LF.2).
        multivalued: true
    class_uri: slsa:SlsaSourceProvenance
  SlsaDependencyInventory:
    name: SlsaDependencyInventory
    definition_uri: https://w3id.org/lmodel/slsa/SlsaDependencyInventory
    description: The inventory of every third-party build dependency, direct and transitive,
      of one artifact version.
    comments:
    - The Dependency track is a working draft and not part of the SLSA v1.2 release.
    - A build-time SBOM or a lock file with hashes is a common form of the inventory.
    in_subset:
    - slsa_dependency_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_dependency
    see_also:
    - https://slsa.dev/spec/draft/dependency-track
    slots:
    - slsaDependencyInventory__artifact
    - slsaDependencyInventory__dependencies
    - slsaDependencyInventory__dependency_level
    attributes:
      artifact:
        name: artifact
        description: The artifact whose dependencies are inventoried.
        range: InTotoResourceDescriptor
        required: true
        inlined: true
      dependencies:
        name: dependencies
        description: The dependencies, each identified by URI and digest.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
      dependency_level:
        name: dependency_level
        description: The SLSA Dependency level the producer's process meets for this
          artifact.
        range: SlsaDependencyLevel
    class_uri: slsa:SlsaDependencyInventory
  SlsaBuildImageProducer:
    name: SlsaBuildImageProducer
    definition_uri: https://w3id.org/lmodel/slsa/SlsaBuildImageProducer
    description: The party that creates and distributes build images; the hosted build
      platform itself, or a third party in a bring-your-own-image setting.
    in_subset:
    - slsa_build_environment_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_build_environment
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#build-environment-model
    is_a: SlsaParty
    slots:
    - slsaParty__party_type
    - slsaParty__party_name
    class_uri: slsa:SlsaBuildImageProducer
  SlsaBuildImage:
    name: SlsaBuildImage
    definition_uri: https://w3id.org/lmodel/slsa/SlsaBuildImage
    description: 'The template a build environment is instantiated from, such as a
      VM or container image: root filesystem, guest OS and packages, build executor
      and build agent.'
    comments:
    - The Build Environment track is a working draft and not part of the SLSA v1.2
      release.
    in_subset:
    - slsa_build_environment_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_build_environment
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#build-environment-model
    slots:
    - build_env_level
    - slsaBuildImage__image_uri
    - slsaBuildImage__provenance
    - slsaBuildImage__produced_by
    attributes:
      image_uri:
        name: image_uri
        description: The URI that identifies the image version, such as an OCI reference
          with its digest.
        identifier: true
        range: uri
      provenance:
        name: provenance
        description: The build provenance of the image itself, required at Build Environment
          L1.
        range: SlsaBuildProvenance
        inlined: true
      produced_by:
        name: produced_by
        description: The party that created and distributes the image.
        range: SlsaBuildImageProducer
        inlined: true
    class_uri: slsa:SlsaBuildImage
  SlsaMeasurement:
    name: SlsaMeasurement
    definition_uri: https://w3id.org/lmodel/slsa/SlsaMeasurement
    description: The digest of one component or state of a build environment, to compare
      with its reference value.
    in_subset:
    - slsa_build_environment_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_build_environment
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#build-environment-model
    slots:
    - digest
    - slsaMeasurement__measured_component
    attributes:
      measured_component:
        name: measured_component
        description: The component or state that was measured, such as the bootloader,
          guest kernel, build agent or root filesystem.
        required: true
    class_uri: slsa:SlsaMeasurement
  SlsaBuildEnvironmentAttestation:
    name: SlsaBuildEnvironmentAttestation
    definition_uri: https://w3id.org/lmodel/slsa/SlsaBuildEnvironmentAttestation
    description: 'Evidence of the state of a build environment when a build was dispatched
      to it: the image it came from and the measurements taken at boot.'
    comments:
    - The track names no single predicate type; platforms issue this evidence in formats
      such as SCAI or a VSA.
    in_subset:
    - slsa_build_environment_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_build_environment
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#buildenv-levels
    is_a: SlsaPredicate
    slots:
    - slsaPredicate__predicate_kind
    - build_env_level
    - slsaBuildEnvironmentAttestation__build_id
    - slsaBuildEnvironmentAttestation__build_image
    - slsaBuildEnvironmentAttestation__measurements
    attributes:
      build_id:
        name: build_id
        description: The immutable identifier of the build execution the environment
          was assigned to.
        required: true
      build_image:
        name: build_image
        description: The image the environment was instantiated from.
        range: SlsaBuildImage
      measurements:
        name: measurements
        description: The measurements of the environment's components taken during
          boot.
        range: SlsaMeasurement
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: slsa:SlsaBuildEnvironmentAttestation
  SlsaAdoptionMetadata:
    name: SlsaAdoptionMetadata
    definition_uri: https://w3id.org/lmodel/slsa/SlsaAdoptionMetadata
    description: The adoption challenges a deployment meets and the strategies it
      applies, from the study's taxonomy.
    notes:
    - The study analysed 1,523 SLSA-related GitHub issues from 233 repositories and
      derived four challenge themes and five strategy themes.
    in_subset:
    - slsa_adoption_study
    from_schema: https://w3id.org/lmodel/slsa/slsa_adoption
    see_also:
    - https://arxiv.org/abs/2409.05014
    slots:
    - slsaAdoptionMetadata__challenges
    - slsaAdoptionMetadata__strategies
    attributes:
      challenges:
        name: challenges
        description: The challenge themes that apply.
        range: SlsaAdoptionChallenge
        multivalued: true
      strategies:
        name: strategies
        description: The strategy themes applied or recommended.
        range: SlsaAdoptionStrategy
        multivalued: true
    class_uri: slsa:SlsaAdoptionMetadata
metamodel_version: 1.12.0
