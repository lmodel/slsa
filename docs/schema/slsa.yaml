name: slsa
description: 'A LinkML model of the SLSA specification: its tracks and levels, the
  roles and systems in a software supply chain, and the in-toto attestations that
  carry build provenance and verification summaries.'
title: Supply-chain Levels for Software Artifacts (SLSA)
comments:
- The version is the SLSA specification version the model renders. The Dependency
  and Build Environment tracks follow the working draft at that version, which the
  release does not include.
- slsa_core imports only the LinkML types, each track module imports the core, and
  this file adds only the document root, so an importer can take one module.
source: https://slsa.dev/spec/v1.2
see_also:
- https://lmodel.github.io/slsa
- https://slsa.dev/spec/v1.2/
- https://github.com/slsa-framework/slsa
id: https://w3id.org/lmodel/slsa
version: 1.2.0
imports:
- linkml:types
- ./slsa_core
- ./slsa_build
- ./slsa_verification
- ./slsa_source
- ./slsa_dependency
- ./slsa_build_environment
- ./slsa_adoption
license: Apache-2.0
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  slsa:
    prefix_prefix: slsa
    prefix_reference: https://w3id.org/lmodel/slsa/
default_prefix: slsa
default_range: string
subsets:
  slsa_build_track:
    name: slsa_build_track
    definition_uri: https://w3id.org/lmodel/slsa/SlsaBuildTrack
    description: Elements of the SLSA Build track, which measures the trustworthiness
      of a build and its provenance.
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
  slsa_source_track:
    name: slsa_source_track
    definition_uri: https://w3id.org/lmodel/slsa/SlsaSourceTrack
    description: Elements of the SLSA Source track, which measures how source revisions
      are created and managed.
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
  slsa_dependency_track:
    name: slsa_dependency_track
    definition_uri: https://w3id.org/lmodel/slsa/SlsaDependencyTrack
    description: Elements of the SLSA Dependency track, a working-draft track for
      managing risk from third-party dependencies.
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
  slsa_build_environment_track:
    name: slsa_build_environment_track
    definition_uri: https://w3id.org/lmodel/slsa/SlsaBuildEnvironmentTrack
    description: Elements of the SLSA Build Environment track, a working-draft track
      for the integrity of the compute environment that runs builds.
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
  slsa_adoption_study:
    name: slsa_adoption_study
    definition_uri: https://w3id.org/lmodel/slsa/SlsaAdoptionStudy
    description: Elements this schema adds from an empirical study of SLSA adoption
      (Tamanna et al., 2024, arXiv:2409.05014). They are not part of the SLSA specification.
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
  slsa_ssf:
    name: slsa_ssf
    definition_uri: https://w3id.org/lmodel/slsa/SlsaSsf
    description: Elements this schema adds from the CNCF TAG-Security Secure Software
      Factory reference architecture and the OpenSSF supply-chain projects. They are
      not part of the SLSA specification.
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  SlsaBuildLevel:
    name: SlsaBuildLevel
    definition_uri: https://w3id.org/lmodel/slsa/SlsaBuildLevel
    description: The levels of the SLSA Build track, each adding protection against
      tampering with the build or its provenance.
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_core
    see_also:
    - https://slsa.dev/spec/v1.2/build-track-basics
    permissible_values:
      SLSA_BUILD_LEVEL_0:
        text: SLSA_BUILD_LEVEL_0
        description: No requirements; the absence of SLSA, as for development or test
          builds.
      SLSA_BUILD_LEVEL_1:
        text: SLSA_BUILD_LEVEL_1
        description: Provenance exists and shows how the package was built; it prevents
          mistakes but is easy to forge.
      SLSA_BUILD_LEVEL_2:
        text: SLSA_BUILD_LEVEL_2
        description: A hosted platform generates and signs the provenance, so tampering
          after the build needs an explicit attack.
        comments:
        - Integrating signing tools into varied CI workflows is a common adoption
          difficulty (Tamanna et al., 2024, CI.2).
      SLSA_BUILD_LEVEL_3:
        text: SLSA_BUILD_LEVEL_3
        description: A hardened platform prevents runs from influencing one another
          and keeps signing material away from build steps, so forging provenance
          needs an exploit.
        comments:
        - Hermetic and isolated builds were the adoption barrier practitioners cited
          most (Tamanna et al., 2024, CI.1).
  SlsaVerificationResult:
    name: SlsaVerificationResult
    definition_uri: https://w3id.org/lmodel/slsa/SlsaVerificationResult
    description: The outcome of verifying an artifact against a policy.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_verification
    permissible_values:
      PASSED:
        text: PASSED
        description: The artifact met the policy.
      FAILED:
        text: FAILED
        description: The artifact did not meet the policy.
  SlsaResult:
    name: SlsaResult
    definition_uri: https://w3id.org/lmodel/slsa/SlsaResult
    description: 'A result of evaluating an artifact against SLSA: a track level,
      a verified property, or a failure. A level implies the levels below it in the
      same track.'
    comments:
    - Issuers may add values of their own, but none that start with SLSA_; this enum
      lists the SLSA-defined values.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_verification
    see_also:
    - https://slsa.dev/spec/v1.2/verification_summary#slsaresult
    - https://slsa.dev/spec/draft/verified-properties
    permissible_values:
      SLSA_BUILD_LEVEL_UNEVALUATED:
        text: SLSA_BUILD_LEVEL_UNEVALUATED
        description: The issuer makes no claim about the Build track level.
      SLSA_BUILD_LEVEL_0:
        text: SLSA_BUILD_LEVEL_0
        description: No Build track guarantees were verified.
      SLSA_BUILD_LEVEL_1:
        text: SLSA_BUILD_LEVEL_1
        description: Build level 1 was verified.
      SLSA_BUILD_LEVEL_2:
        text: SLSA_BUILD_LEVEL_2
        description: Build level 2 was verified.
      SLSA_BUILD_LEVEL_3:
        text: SLSA_BUILD_LEVEL_3
        description: Build level 3 was verified.
      SLSA_SOURCE_LEVEL_UNEVALUATED:
        text: SLSA_SOURCE_LEVEL_UNEVALUATED
        description: The issuer makes no claim about the Source track level.
      SLSA_SOURCE_LEVEL_0:
        text: SLSA_SOURCE_LEVEL_0
        description: No Source track guarantees were verified.
      SLSA_SOURCE_LEVEL_1:
        text: SLSA_SOURCE_LEVEL_1
        description: Source level 1 was verified.
      SLSA_SOURCE_LEVEL_2:
        text: SLSA_SOURCE_LEVEL_2
        description: Source level 2 was verified.
      SLSA_SOURCE_LEVEL_3:
        text: SLSA_SOURCE_LEVEL_3
        description: Source level 3 was verified.
      SLSA_SOURCE_LEVEL_4:
        text: SLSA_SOURCE_LEVEL_4
        description: Source level 4 was verified.
      SLSA_SOURCE_TWO_PARTY_REVIEWED:
        text: SLSA_SOURCE_TWO_PARTY_REVIEWED
        description: The verified property that two trusted persons reviewed the source,
          at whatever source level.
      SLSA_BUILD_REPRODUCED:
        text: SLSA_BUILD_REPRODUCED
        description: The verified property that two or more independent build platforms
          reproduced the artifact.
      FAILED:
        text: FAILED
        description: Policy evaluation failed.
  SlsaSourceLevel:
    name: SlsaSourceLevel
    definition_uri: https://w3id.org/lmodel/slsa/SlsaSourceLevel
    description: The levels of the SLSA Source track, each adding trust in how a revision
      was created.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_source
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#basics
    permissible_values:
      SLSA_SOURCE_LEVEL_0:
        text: SLSA_SOURCE_LEVEL_0
        description: No Source track claims; the SCS issued no VSA for the revision.
      SLSA_SOURCE_LEVEL_1:
        text: SLSA_SOURCE_LEVEL_1
        description: The source is managed in a version control system, so it has
          discrete, immutable revisions.
      SLSA_SOURCE_LEVEL_2:
        text: SLSA_SOURCE_LEVEL_2
        description: Branch history is continuous and retained, and the SCS issues
          source provenance for each new revision.
      SLSA_SOURCE_LEVEL_3:
        text: SLSA_SOURCE_LEVEL_3
        description: The SCS enforces the organization's technical controls on protected
          named references and provides evidence of them.
      SLSA_SOURCE_LEVEL_4:
        text: SLSA_SOURCE_LEVEL_4
        description: Two trusted persons agree to every change on protected branches.
        comments:
        - Whether pair or mob programming counts as two-party review is an open question
          (Tamanna et al., 2024, LF.2).
  SlsaReviewType:
    name: SlsaReviewType
    definition_uri: https://w3id.org/lmodel/slsa/SlsaReviewType
    annotations:
      study_theme:
        tag: study_theme
        value: LF.2
    description: The forms of review that may approve a revision, including the contested
      forms the adoption study records.
    in_subset:
    - slsa_source_track
    - slsa_adoption_study
    from_schema: https://w3id.org/lmodel/slsa/slsa_source
    see_also:
    - https://arxiv.org/abs/2409.05014
    permissible_values:
      TWO_PARTY:
        text: TWO_PARTY
        description: A reviewer distinct from the author approved the change, both
          being trusted persons.
      PAIR_PROGRAMMING:
        text: PAIR_PROGRAMMING
        description: Two developers wrote the change together at one workstation or
          screen; whether this counts as two-party review is open.
      MOB_PROGRAMMING:
        text: MOB_PROGRAMMING
        description: A group wrote the change together; whether this counts as two-party
          review is open.
      AUTOMATED:
        text: AUTOMATED
        description: A tool or bot reviewed the change with no second person, which
          does not meet Source L4.
  SlsaDependencyLevel:
    name: SlsaDependencyLevel
    definition_uri: https://w3id.org/lmodel/slsa/SlsaDependencyLevel
    description: The levels of the SLSA Dependency track, each reducing the risk third-party
      dependencies bring.
    in_subset:
    - slsa_dependency_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_dependency
    see_also:
    - https://slsa.dev/spec/draft/dependency-track#levels
    permissible_values:
      SLSA_DEPENDENCY_LEVEL_0:
        text: SLSA_DEPENDENCY_LEVEL_0
        description: No Dependency track claims.
      SLSA_DEPENDENCY_LEVEL_1:
        text: SLSA_DEPENDENCY_LEVEL_1
        description: An inventory of all build dependencies, direct and transitive,
          exists.
      SLSA_DEPENDENCY_LEVEL_2:
        text: SLSA_DEPENDENCY_LEVEL_2
        description: Every known vulnerability in the dependencies was triaged before
          release.
      SLSA_DEPENDENCY_LEVEL_3:
        text: SLSA_DEPENDENCY_LEVEL_3
        description: Every third-party build dependency is consumed from a location
          the producer controls.
      SLSA_DEPENDENCY_LEVEL_4:
        text: SLSA_DEPENDENCY_LEVEL_4
        description: An ingestion policy keeps compromised upstream dependencies out
          of the build.
  SlsaBuildEnvironmentLevel:
    name: SlsaBuildEnvironmentLevel
    definition_uri: https://w3id.org/lmodel/slsa/SlsaBuildEnvironmentLevel
    description: The levels of the SLSA Build Environment track, each extending integrity
      further into the compute that runs builds.
    in_subset:
    - slsa_build_environment_track
    from_schema: https://w3id.org/lmodel/slsa/slsa_build_environment
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#track-overview
    permissible_values:
      SLSA_BUILD_ENV_LEVEL_0:
        text: SLSA_BUILD_ENV_LEVEL_0
        description: No Build Environment track claims.
      SLSA_BUILD_ENV_LEVEL_1:
        text: SLSA_BUILD_ENV_LEVEL_1
        description: The build image has signed build provenance, protecting against
          tampering while the image is distributed.
      SLSA_BUILD_ENV_LEVEL_2:
        text: SLSA_BUILD_ENV_LEVEL_2
        description: The compute platform attests to the environment's state at boot,
          protecting against tampering through the control plane.
      SLSA_BUILD_ENV_LEVEL_3:
        text: SLSA_BUILD_ENV_LEVEL_3
        description: Trusted hardware attests to the host's state, protecting against
          tampering through the host interface.
  SlsaAdoptionChallenge:
    name: SlsaAdoptionChallenge
    definition_uri: https://w3id.org/lmodel/slsa/SlsaAdoptionChallenge
    description: The four themes of difficulty practitioners met when adopting SLSA.
    in_subset:
    - slsa_adoption_study
    from_schema: https://w3id.org/lmodel/slsa/slsa_adoption
    see_also:
    - https://arxiv.org/abs/2409.05014
    permissible_values:
      COMPLEX_IMPLEMENTATION:
        text: COMPLEX_IMPLEMENTATION
        description: Generating provenance and maintaining the required tools is complicated.
        annotations:
          study_theme:
            tag: study_theme
            value: CI
        comments:
        - 'Sub-themes: complicated provenance generation (CI.1) and intricate tool
          maintenance (CI.2); 901 issues.'
      UNCLEAR_COMMUNICATION:
        text: UNCLEAR_COMMUNICATION
        description: SLSA's terms and its guidance for particular ecosystems are hard
          to understand.
        annotations:
          study_theme:
            tag: study_theme
            value: UC
        comments:
        - 'Sub-themes: unclear definitions of key terms (UC.1) and a lack of ecosystem-
          specific guidance (UC.2); 357 issues.'
      LIMITED_FEASIBILITY:
        text: LIMITED_FEASIBILITY
        description: Verification tooling, attestation storage and two-party review
          are hard to put into practice.
        annotations:
          study_theme:
            tag: study_theme
            value: LF
        comments:
        - 'Sub-themes: verification and storage (LF.1) and two-party review for small
          projects (LF.2); 219 issues.'
      UNCLEAR_RELEVANCE:
        text: UNCLEAR_RELEVANCE
        description: Which attacks SLSA mitigates, and how it differs from other practices,
          is unclear.
        annotations:
          study_theme:
            tag: study_theme
            value: UR
        comments:
        - 'Sub-theme: unclear scope and ecosystem-level inconsistencies (UR.1); 46
          issues.'
  SlsaAdoptionStrategy:
    name: SlsaAdoptionStrategy
    definition_uri: https://w3id.org/lmodel/slsa/SlsaAdoptionStrategy
    description: The five themes of strategy practitioners proposed for the adoption
      challenges.
    in_subset:
    - slsa_adoption_study
    from_schema: https://w3id.org/lmodel/slsa/slsa_adoption
    see_also:
    - https://arxiv.org/abs/2409.05014
    permissible_values:
      ENHANCE_ALIGNMENT_FLEXIBILITY:
        text: ENHANCE_ALIGNMENT_FLEXIBILITY
        description: Make SLSA fit more contexts, with build-system tracks, flexibility
          for varied organizations and alignment with OpenSSF practices.
        annotations:
          study_theme:
            tag: study_theme
            value: S1
      PROVIDE_DETAILED_DOCUMENTATION:
        text: PROVIDE_DETAILED_DOCUMENTATION
        description: Give clearer definitions, standard terms, negative examples and
          better navigation.
        annotations:
          study_theme:
            tag: study_theme
            value: S2
      STREAMLINE_PROVENANCE_GENERATION:
        text: STREAMLINE_PROVENANCE_GENERATION
        description: Simplify and standardize provenance generation with tools and
          templates, and fix release-tool inconsistencies.
        annotations:
          study_theme:
            tag: study_theme
            value: S3
      IMPROVE_VERIFICATION_PROCESS:
        text: IMPROVE_VERIFICATION_PROCESS
        description: Strengthen verification and level determination, tag versions
          early, and give downstream users more signals.
        annotations:
          study_theme:
            tag: study_theme
            value: S4
      COLLABORATE_WITH_COMMUNITY:
        text: COLLABORATE_WITH_COMMUNITY
        description: Align with industry standards, guide newcomers, and share knowledge
          across projects.
        annotations:
          study_theme:
            tag: study_theme
            value: S5
