    comments:
    - The statement that carries it has predicate_type https://slsa.dev/provenance/v1.
    - Complicated provenance generation was the challenge with the most issues in
      the study (Tamanna et al., 2024, CI.1).
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#provenance
    is_a: SlsaPredicate
    attributes:
      build_definition:
        name: build_definition
        description: The inputs to the build; required at Build L1.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaBuildProvenance
        domain_of:
        - SlsaBuildProvenance
        range: SlsaBuildDefinition
        required: true
        inlined: true
      run_details:
        name: run_details
        description: What is specific to this execution of the build; required at
          Build L1.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaBuildProvenance
        domain_of:
        - SlsaBuildProvenance
        range: SlsaRunDetails
        required: true
        inlined: true
      predicate_kind:
        name: predicate_kind
        description: The kind of predicate, one of this class's descendants.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        designates_type: true
        owner: SlsaBuildProvenance
        domain_of:
        - SlsaPredicate
        range: string
  SlsaBuildDefinition:
    name: SlsaBuildDefinition
    description: The inputs to a build, in enough detail to initialize it and begin
      execution; the builder vouches for their accuracy.
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#builddefinition
    attributes:
      build_type:
        name: build_type
        description: The URI of the template that says how to run the build and read
          its parameters and dependencies; required at Build L1.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaBuildDefinition
        domain_of:
        - SlsaBuildDefinition
        range: uri
        required: true
      external_parameters:
        name: external_parameters
        description: The inputs under the tenant's control; required at Build L1,
          complete at Build L3 and verified by consumers.
        comments:
        - Verifiers reject parameters they do not recognize here.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaBuildDefinition
        domain_of:
        - SlsaBuildDefinition
        range: SlsaBuildParameter
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
      internal_parameters:
        name: internal_parameters
        description: The inputs the platform sets itself; kept for debugging, incident
          response and reproduction, and not verified by consumers.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaBuildDefinition
        domain_of:
        - SlsaBuildDefinition
        range: SlsaBuildParameter
        multivalued: true
        inlined: true
        inlined_as_list: true
      resolved_dependencies:
        name: resolved_dependencies
        description: The artifacts fetched during the build, as far as the platform
          knows them; completeness is best effort through Build L3.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaBuildDefinition
        domain_of:
        - SlsaBuildDefinition
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
      hermetic:
        name: hermetic
        description: Whether the build could reach only the dependencies it declared,
          with no other network or filesystem access.
        comments:
        - SLSA v1.2 does not require hermetic builds; Build L3's isolation is a different
          property, and hermeticity is a candidate for a future Build L4.
        - The study cites a 2023 industry survey in which over half the participants
          found hermetic builds hard to implement, and lists "hermetic build" among
          SLSA's unclear terms (Tamanna et al., 2024, UC.1).
        in_subset:
        - slsa_adoption_study
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaBuildDefinition
        domain_of:
        - SlsaBuildDefinition
        range: boolean
      provenance_generation_tool:
        name: provenance_generation_tool
        description: The tool that generated this provenance, named by URI.
        comments:
        - Naming the generator supports the strategy of standardizing provenance generation
          (Tamanna et al., 2024, S3.1).
        in_subset:
        - slsa_adoption_study
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaBuildDefinition
        domain_of:
        - SlsaBuildDefinition
        range: uri
      pipeline_orchestrator:
        name: pipeline_orchestrator
        description: The CI/CD system that coordinated the build, named by URI, where
          it differs from the builder.
        comments:
        - In the Secure Software Factory architecture this is the Build Service layer,
          distinct from the provenance-generating builder.
        in_subset:
        - slsa_ssf
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaBuildDefinition
        domain_of:
        - SlsaBuildDefinition
        range: uri
  SlsaBuildParameter:
    name: SlsaBuildParameter
    description: One named input to a build, with a string value.
    comments:
    - The specification recommends string values; a structured value is written as
      its JSON text.
    - Each name appears once in a list, since the attestation's JSON uses it as a
      key; the validator does not check this.
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa
    attributes:
      parameter_name:
        name: parameter_name
        description: The parameter's name.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaBuildParameter
        domain_of:
        - SlsaBuildParameter
        range: string
        required: true
      parameter_value:
        name: parameter_value
        description: The parameter's value.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaBuildParameter
        domain_of:
        - SlsaBuildParameter
        range: string
  SlsaRunDetails:
    name: SlsaRunDetails
    description: 'What is specific to one execution of a build: the platform that
      ran it, metadata about the run and its by-products.'
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#rundetails
    attributes:
      builder:
        name: builder
        description: The build platform that ran the build and is trusted to have
          written this provenance; required at Build L1.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaRunDetails
        domain_of:
        - SlsaRunDetails
        range: SlsaBuildPlatform
        required: true
        inlined: true
      build_metadata:
        name: build_metadata
        description: Metadata about this execution of the build.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaRunDetails
        domain_of:
        - SlsaRunDetails
        range: SlsaBuildMetadata
        inlined: true
      byproducts:
        name: byproducts
        description: Artifacts the build produced beside its outputs that may help
          debugging or incident response, such as logs.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaRunDetails
        domain_of:
        - SlsaRunDetails
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
  SlsaBuildMetadata:
    name: SlsaBuildMetadata
    description: 'Metadata about one execution of a build: its identifier and when
      it started and finished.'
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#buildmetadata
    attributes:
      invocation_id:
        name: invocation_id
        description: An identifier for this build invocation, in a format the builder
          defines; useful for finding its logs.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaBuildMetadata
        domain_of:
        - SlsaBuildMetadata
        range: string
      started_on:
        name: started_on
        description: When the build started.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaBuildMetadata
        domain_of:
        - SlsaBuildMetadata
        range: datetime
      finished_on:
        name: finished_on
        description: When the build finished.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build
        owner: SlsaBuildMetadata
        domain_of:
        - SlsaBuildMetadata
        range: datetime
  SlsaVerificationSummary:
    name: SlsaVerificationSummary
    description: The predicate in which a verifier records that it evaluated artifacts
      against a policy and the SLSA levels they met, so consumers can rely on the
      verifier instead of reading every underlying attestation.
    comments:
    - The statement that carries it has predicate_type https://slsa.dev/verification_summary/v1.
    - A Source VSA is this predicate with the repository as resource_uri and the revision
      id in the subject's digest.
    - Verification tooling and the places attestations are stored were an adoption
      difficulty practitioners reported (Tamanna et al., 2024, LF.1).
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/v1.2/verification_summary
    - https://slsa.dev/spec/v1.2/source-requirements#source-verification-summary-attestation
    is_a: SlsaPredicate
    slots:
    - resource_uri
    slot_usage:
      resource_uri:
        name: resource_uri
        description: The URI consumers fetch the artifact from, which the verifier
          verified it as.
        required: true
    attributes:
      verifier:
        name: verifier
        description: The verifier that made this determination.
        from_schema: https://w3id.org/lmodel/slsa/slsa_verification
        owner: SlsaVerificationSummary
        domain_of:
        - SlsaVerificationSummary
        range: SlsaVerifier
        required: true
        inlined: true
      time_verified:
        name: time_verified
        description: When the verification happened.
        from_schema: https://w3id.org/lmodel/slsa/slsa_verification
        owner: SlsaVerificationSummary
        domain_of:
        - SlsaVerificationSummary
        range: datetime
      policy:
        name: policy
        description: The policy the subject was verified against, by URI and preferably
          by digest too.
        from_schema: https://w3id.org/lmodel/slsa/slsa_verification
        owner: SlsaVerificationSummary
        domain_of:
        - SlsaVerificationSummary
        range: SlsaVerificationSummaryPolicy
        required: true
        inlined: true
      input_attestations:
        name: input_attestations
        description: Every attestation the verifier consulted, each with a digest;
          complete when present.
        from_schema: https://w3id.org/lmodel/slsa/slsa_verification
        owner: SlsaVerificationSummary
        domain_of:
        - SlsaVerificationSummary
        range: SlsaVerificationSummaryInputAttestation
        multivalued: true
        inlined: true
        inlined_as_list: true
      verification_result:
        name: verification_result
        description: Whether the subject passed the policy.
        from_schema: https://w3id.org/lmodel/slsa/slsa_verification
        owner: SlsaVerificationSummary
        domain_of:
        - SlsaVerificationSummary
        range: SlsaVerificationResult
        required: true
      verified_levels:
        name: verified_levels
        description: The highest level verified in each track, any verified property,
          and any result of the issuer's own; a level implies the levels below it.
        comments:
        - A VSA lists at most one level per track, and only FAILED when verification
          failed; the validator checks neither.
        from_schema: https://w3id.org/lmodel/slsa/slsa_verification
        owner: SlsaVerificationSummary
        domain_of:
        - SlsaVerificationSummary
        range: slsa_result_value
        required: true
        multivalued: true
        pattern: ^(SLSA_BUILD_LEVEL_(UNEVALUATED|[0-3])|SLSA_SOURCE_LEVEL_(UNEVALUATED|[0-4])|SLSA_SOURCE_TWO_PARTY_REVIEWED|SLSA_BUILD_REPRODUCED|([!-RT-rt-~]|[Ss]$|[Ss][!-KM-km-~]|[Ss][Ll]$|[Ss][Ll][!-RT-rt-~]|[Ss][Ll][Ss]$|[Ss][Ll][Ss][!-@B-`b-~]|[Ss][Ll][Ss][Aa]$|[Ss][Ll][Ss][Aa][!-^`-~])[!-~]*)$
        minimum_cardinality: 1
      organization_properties:
        name: organization_properties
        description: Properties the organization defines for the revision, each prefixed
          ORG_SOURCE_; ORG_SOURCE_INTERNAL_ marks one not meant for external consumers.
        deprecated: Write these properties in verified_levels, where the attestation's
          JSON puts them; this field goes in a later release.
        in_subset:
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa/slsa_verification
        deprecated_element_has_possible_replacement: slsa:verified_levels
        owner: SlsaVerificationSummary
        domain_of:
        - SlsaVerificationSummary
        range: string
        multivalued: true
        pattern: ^ORG_SOURCE_
      dependency_levels:
        name: dependency_levels
        description: How many transitive dependencies were verified at each level;
          absent when the verifier makes no claim about dependencies.
        comments:
        - The attestation's JSON tells an empty map (no dependencies) from an absent
          one (no claim); this list cannot, so an empty list reads as no claim.
        from_schema: https://w3id.org/lmodel/slsa/slsa_verification
        owner: SlsaVerificationSummary
        domain_of:
        - SlsaVerificationSummary
        range: SlsaDependencyLevelCount
        multivalued: true
        inlined: true
        inlined_as_list: true
      slsa_version:
        name: slsa_version
        description: The SLSA specification version the verifier applied, as MAJOR.MINOR.
        from_schema: https://w3id.org/lmodel/slsa/slsa_verification
        owner: SlsaVerificationSummary
        domain_of:
        - SlsaVerificationSummary
        range: string
        pattern: ^[0-9]+\.[0-9]+$
      resource_uri:
        name: resource_uri
        description: The URI consumers fetch the artifact from, which the verifier
          verified it as.
        in_subset:
        - slsa_build_track
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:resource_uri
        owner: SlsaVerificationSummary
        domain_of:
        - InTotoResourceDescriptor
        - SlsaVerificationSummary
        range: uri
        required: true
      predicate_kind:
        name: predicate_kind
        description: The kind of predicate, one of this class's descendants.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        designates_type: true
        owner: SlsaVerificationSummary
        domain_of:
        - SlsaPredicate
        range: string
  SlsaDependencyLevelCount:
    name: SlsaDependencyLevelCount
    description: The number of an artifact's transitive dependencies verified at one
      level, each counted once per track at its highest level.
    comments:
    - Each level appears once in a list, since the attestation's JSON uses it as a
      key; the validator does not check this.
    in_subset:
    - slsa_build_track
    from_schema: https://w3id.org/lmodel/slsa
    attributes:
      verified_level:
        name: verified_level
        description: The level the dependencies were verified at, or a result of the
          issuer's own.
        from_schema: https://w3id.org/lmodel/slsa/slsa_verification
        owner: SlsaDependencyLevelCount
        domain_of:
        - SlsaDependencyLevelCount
        range: slsa_result_value
        required: true
        pattern: ^(SLSA_BUILD_LEVEL_(UNEVALUATED|[0-3])|SLSA_SOURCE_LEVEL_(UNEVALUATED|[0-4])|SLSA_SOURCE_TWO_PARTY_REVIEWED|SLSA_BUILD_REPRODUCED|([!-RT-rt-~]|[Ss]$|[Ss][!-KM-km-~]|[Ss][Ll]$|[Ss][Ll][!-RT-rt-~]|[Ss][Ll][Ss]$|[Ss][Ll][Ss][!-@B-`b-~]|[Ss][Ll][Ss][Aa]$|[Ss][Ll][Ss][Aa][!-^`-~])[!-~]*)$
      dependency_count:
        name: dependency_count
        description: How many dependencies were verified at that level.
        from_schema: https://w3id.org/lmodel/slsa/slsa_verification
        owner: SlsaDependencyLevelCount
        domain_of:
        - SlsaDependencyLevelCount
        range: integer
        required: true
        minimum_value: 0
  SlsaVerificationSummaryPolicy:
    name: SlsaVerificationSummaryPolicy
    description: 'The policy a verification summary applied: a resource descriptor
      that names the policy by URI.'
    comments:
    - A digest is recommended as well, to pin the exact version of the policy.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/v1.2/verification_summary#policy
    is_a: InTotoResourceDescriptor
    slot_usage:
      resource_uri:
        name: resource_uri
        required: true
      digest:
        name: digest
        recommended: true
    attributes:
      resource_uri:
        name: resource_uri
        description: The URI that identifies a resource, such as a package URL, a
          git repository address or an OCI image reference.
        in_subset:
        - slsa_build_track
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:resource_uri
        owner: SlsaVerificationSummaryPolicy
        domain_of:
        - InTotoResourceDescriptor
        - SlsaVerificationSummary
        range: uri
        required: true
      digest:
        name: digest
        description: The cryptographic digests of a resource's content, keyed by algorithm.
        in_subset:
        - slsa_build_track
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:digest
        owner: SlsaVerificationSummaryPolicy
        domain_of:
        - InTotoResourceDescriptor
        - SlsaMeasurement
        range: InTotoDigestSet
        recommended: true
        inlined: true
      resource_name:
        name: resource_name
        description: A name for the resource within the attestation that carries it.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: SlsaVerificationSummaryPolicy
        domain_of:
        - InTotoResourceDescriptor
        range: string
      download_location:
        name: download_location
        description: Where the resource can be fetched, when that differs from its
          identifying URI.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: SlsaVerificationSummaryPolicy
        domain_of:
        - InTotoResourceDescriptor
        range: uri
      media_type:
        name: media_type
        description: The IANA media type of the resource's content.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: SlsaVerificationSummaryPolicy
        domain_of:
        - InTotoResourceDescriptor
        range: string
      content:
        name: content
        description: The resource's content itself, base64-encoded, for a resource
          small enough to carry inline.
        comments:
        - The in-toto framework asks for content under 1 KB, so that attestations
          stay small.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: SlsaVerificationSummaryPolicy
        domain_of:
        - InTotoResourceDescriptor
        range: string
        pattern: ^[A-Za-z0-9+/_-]+={0,2}$
      annotations:
        name: annotations
        description: Vendor-specific annotations on the resource, such as the source
          references a Source VSA records.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: SlsaVerificationSummaryPolicy
        domain_of:
        - InTotoResourceDescriptor
        range: InTotoAnnotation
        multivalued: true
        inlined: true
        inlined_as_list: true
  SlsaVerificationSummaryInputAttestation:
    name: SlsaVerificationSummaryInputAttestation
    description: 'One attestation a verifier consulted: a resource descriptor that
      carries the attestation''s digest.'
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/v1.2/verification_summary#inputAttestations
    is_a: InTotoResourceDescriptor
    slot_usage:
      digest:
        name: digest
        required: true
      resource_uri:
        name: resource_uri
        recommended: true
    attributes:
      resource_uri:
        name: resource_uri
        description: The URI that identifies a resource, such as a package URL, a
          git repository address or an OCI image reference.
        in_subset:
        - slsa_build_track
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:resource_uri
        owner: SlsaVerificationSummaryInputAttestation
        domain_of:
        - InTotoResourceDescriptor
        - SlsaVerificationSummary
        range: uri
        recommended: true
      digest:
        name: digest
        description: The cryptographic digests of a resource's content, keyed by algorithm.
        in_subset:
        - slsa_build_track
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:digest
        owner: SlsaVerificationSummaryInputAttestation
        domain_of:
        - InTotoResourceDescriptor
        - SlsaMeasurement
        range: InTotoDigestSet
        required: true
        inlined: true
      resource_name:
        name: resource_name
        description: A name for the resource within the attestation that carries it.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: SlsaVerificationSummaryInputAttestation
        domain_of:
        - InTotoResourceDescriptor
        range: string
      download_location:
        name: download_location
        description: Where the resource can be fetched, when that differs from its
          identifying URI.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: SlsaVerificationSummaryInputAttestation
        domain_of:
        - InTotoResourceDescriptor
        range: uri
      media_type:
        name: media_type
        description: The IANA media type of the resource's content.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: SlsaVerificationSummaryInputAttestation
        domain_of:
        - InTotoResourceDescriptor
        range: string
      content:
        name: content
        description: The resource's content itself, base64-encoded, for a resource
          small enough to carry inline.
        comments:
        - The in-toto framework asks for content under 1 KB, so that attestations
          stay small.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: SlsaVerificationSummaryInputAttestation
        domain_of:
        - InTotoResourceDescriptor
        range: string
        pattern: ^[A-Za-z0-9+/_-]+={0,2}$
      annotations:
        name: annotations
        description: Vendor-specific annotations on the resource, such as the source
          references a Source VSA records.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: SlsaVerificationSummaryInputAttestation
        domain_of:
        - InTotoResourceDescriptor
        range: InTotoAnnotation
        multivalued: true
        inlined: true
        inlined_as_list: true
  SlsaSourceControlSystem:
    name: SlsaSourceControlSystem
    description: The platform or services that host a source repository and enforce
      its organization's policies on authentication, authorization and change management.
    comments:
    - The SCS issues the Source VSAs and source provenance for the revisions it hosts.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    attributes:
      scs_uri:
        name: scs_uri
        description: The URI that identifies the source control system.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        identifier: true
        owner: SlsaSourceControlSystem
        domain_of:
        - SlsaSourceControlSystem
        range: uri
        required: true
  SlsaSourceRepository:
    name: SlsaSourceRepository
    description: A self-contained unit that holds a set of files, their revision history
      and metadata such as branches and tags.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    attributes:
      repository_uri:
        name: repository_uri
        description: The stable locator the SCS gives the repository.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        identifier: true
        owner: SlsaSourceRepository
        domain_of:
        - SlsaSourceRepository
        range: uri
        required: true
      hosted_by:
        name: hosted_by
        description: The source control system that hosts the repository.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        owner: SlsaSourceRepository
        domain_of:
        - SlsaSourceRepository
        range: SlsaSourceControlSystem
  SlsaSourceRevision:
    name: SlsaSourceRevision
    description: 'A logically immutable snapshot of a repository''s tracked files,
      with its version-control metadata: author, time and parent revisions.'
    comments:
    - A revision id is unique within its repository and may recur in another; a document
      that holds revisions from several repositories qualifies them.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    slots:
    - repository
    attributes:
      revision_id:
        name: revision_id
        description: The revision identifier the SCS assigns, such as a git commit
          id or a path- qualified sequence number.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        identifier: true
        owner: SlsaSourceRevision
        domain_of:
        - SlsaSourceRevision
        range: string
        required: true
      authored_by:
        name: authored_by
        description: The identity of the person or automation that authored the revision.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        owner: SlsaSourceRevision
        domain_of:
        - SlsaSourceRevision
        range: string
      authored_at:
        name: authored_at
        description: When the revision was created.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        owner: SlsaSourceRevision
        domain_of:
        - SlsaSourceRevision
        range: datetime
      parent_revisions:
        name: parent_revisions
        description: The revisions this one descends from, which together form the
          change history.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        owner: SlsaSourceRevision
        domain_of:
        - SlsaSourceRevision
        range: SlsaSourceRevision
        multivalued: true
      source_level:
        name: source_level
        description: The SLSA Source level the SCS asserts for the revision.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        owner: SlsaSourceRevision
        domain_of:
        - SlsaSourceRevision
        range: SlsaSourceLevel
      review_type:
        name: review_type
        description: The form of review that approved the revision.
        in_subset:
        - slsa_adoption_study
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        owner: SlsaSourceRevision
        domain_of:
        - SlsaSourceRevision
        range: SlsaReviewType
      repository:
        name: repository
        description: The source repository this belongs to.
        in_subset:
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:repository
        owner: SlsaSourceRevision
        domain_of:
        - SlsaSourceRevision
        - SlsaNamedReference
        range: SlsaSourceRepository
  SlsaNamedReference:
    name: SlsaNamedReference
    description: A user-friendly name for a revision in a repository, such as main
      or v1.2.3; reference_type says whether it is a branch or a tag.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    slots:
    - repository
    - revision
    attributes:
      reference_type:
        name: reference_type
        description: The kind of named reference, one of this class's descendants.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        designates_type: true
        owner: SlsaNamedReference
        domain_of:
        - SlsaNamedReference
        range: string
      reference_name:
        name: reference_name
        description: The reference's name, fully qualified in git, such as refs/heads/main.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        owner: SlsaNamedReference
        domain_of:
        - SlsaNamedReference
        range: string
        required: true
      protected:
        name: protected
        description: Whether the organization has the SCS enforce its technical controls
          on this reference.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        owner: SlsaNamedReference
        domain_of:
        - SlsaNamedReference
        range: boolean
      repository:
        name: repository
        description: The source repository this belongs to.
        in_subset:
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:repository
        owner: SlsaNamedReference
        domain_of:
        - SlsaSourceRevision
        - SlsaNamedReference
        range: SlsaSourceRepository
      revision:
        name: revision
        description: The source revision this refers to.
        in_subset:
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:revision
        owner: SlsaNamedReference
        domain_of:
        - SlsaNamedReference
        - SlsaSourceProvenance
        range: SlsaSourceRevision
  SlsaBranch:
    name: SlsaBranch
    description: A named reference that moves to track a line of development.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa
    is_a: SlsaNamedReference
    attributes:
      repository:
        name: repository
        description: The source repository this belongs to.
        in_subset:
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:repository
        owner: SlsaBranch
        domain_of:
        - SlsaSourceRevision
        - SlsaNamedReference
        range: SlsaSourceRepository
      revision:
        name: revision
        description: The source revision this refers to.
        in_subset:
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:revision
        owner: SlsaBranch
        domain_of:
        - SlsaNamedReference
        - SlsaSourceProvenance
        range: SlsaSourceRevision
      reference_type:
        name: reference_type
        description: The kind of named reference, one of this class's descendants.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        designates_type: true
        owner: SlsaBranch
        domain_of:
        - SlsaNamedReference
        range: string
      reference_name:
        name: reference_name
        description: The reference's name, fully qualified in git, such as refs/heads/main.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        owner: SlsaBranch
        domain_of:
        - SlsaNamedReference
        range: string
        required: true
      protected:
        name: protected
        description: Whether the organization has the SCS enforce its technical controls
          on this reference.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        owner: SlsaBranch
        domain_of:
        - SlsaNamedReference
        range: boolean
  SlsaTag:
    name: SlsaTag
    description: A named reference meant never to move once created.
    comments:
    - A version-control tag that is allowed to move, such as latest, is a named reference
      and not a tag in this sense.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa
    is_a: SlsaNamedReference
    attributes:
      repository:
        name: repository
        description: The source repository this belongs to.
        in_subset:
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:repository
        owner: SlsaTag
        domain_of:
        - SlsaSourceRevision
        - SlsaNamedReference
        range: SlsaSourceRepository
      revision:
        name: revision
        description: The source revision this refers to.
        in_subset:
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:revision
        owner: SlsaTag
        domain_of:
        - SlsaNamedReference
        - SlsaSourceProvenance
        range: SlsaSourceRevision
      reference_type:
        name: reference_type
        description: The kind of named reference, one of this class's descendants.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        designates_type: true
        owner: SlsaTag
        domain_of:
        - SlsaNamedReference
        range: string
      reference_name:
        name: reference_name
        description: The reference's name, fully qualified in git, such as refs/heads/main.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        owner: SlsaTag
        domain_of:
        - SlsaNamedReference
        range: string
        required: true
      protected:
        name: protected
        description: Whether the organization has the SCS enforce its technical controls
          on this reference.
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        owner: SlsaTag
        domain_of:
        - SlsaNamedReference
        range: boolean
  SlsaSourceProvenance:
    name: SlsaSourceProvenance
    description: Evidence from an SCS of how a revision came to exist and which technical
      controls were enforced when it did.
    comments:
    - SLSA leaves the format of source provenance to each SCS and defines no predicate
      type for it; this class holds what the specification says such provenance conveys.
    - Source L2 and above require the SCS to issue it with each new revision.
    in_subset:
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#source-provenance-attestations
    is_a: SlsaPredicate
    slots:
    - revision
    slot_usage:
      revision:
        name: revision
        required: true
    attributes:
      controls_enforced:
        name: controls_enforced
        description: The technical controls the SCS enforced when the revision was
          created, as the organization documents them.
        comments:
        - Two-party review is a control many single-maintainer projects cannot meet
          (Tamanna et al., 2024, LF.2).
        from_schema: https://w3id.org/lmodel/slsa/slsa_source
        owner: SlsaSourceProvenance
        domain_of:
        - SlsaSourceProvenance
        range: string
        multivalued: true
      revision:
        name: revision
        description: The source revision this refers to.
        in_subset:
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:revision
        owner: SlsaSourceProvenance
        domain_of:
        - SlsaNamedReference
        - SlsaSourceProvenance
        range: SlsaSourceRevision
        required: true
      predicate_kind:
        name: predicate_kind
        description: The kind of predicate, one of this class's descendants.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        designates_type: true
        owner: SlsaSourceProvenance
        domain_of:
        - SlsaPredicate
        range: string
  SlsaDependencyInventory:
    name: SlsaDependencyInventory
    description: The inventory of every third-party build dependency, direct and transitive,
      of one artifact version.
    comments:
    - The Dependency track is a working draft and not part of the SLSA v1.2 release.
    - A build-time SBOM or a lock file with hashes is a common form of the inventory.
    in_subset:
    - slsa_dependency_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/draft/dependency-track
    attributes:
      artifact:
        name: artifact
        description: The artifact whose dependencies are inventoried.
        from_schema: https://w3id.org/lmodel/slsa/slsa_dependency
        owner: SlsaDependencyInventory
        domain_of:
        - SlsaDependencyInventory
        range: InTotoResourceDescriptor
        required: true
        inlined: true
      dependencies:
        name: dependencies
        description: The dependencies, each as a resource descriptor.
        from_schema: https://w3id.org/lmodel/slsa/slsa_dependency
        owner: SlsaDependencyInventory
        domain_of:
        - SlsaDependencyInventory
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
      dependency_level:
        name: dependency_level
        description: The SLSA Dependency level the producer's process meets for this
          artifact.
        from_schema: https://w3id.org/lmodel/slsa/slsa_dependency
        owner: SlsaDependencyInventory
        domain_of:
        - SlsaDependencyInventory
        range: SlsaDependencyLevel
  SlsaBuildImageProducer:
    name: SlsaBuildImageProducer
    description: The party that creates and distributes build images; the hosted build
      platform itself, or a third party in a bring-your-own-image setting.
    in_subset:
    - slsa_build_environment_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#build-environment-model
    is_a: SlsaParty
    attributes:
      party_type:
        name: party_type
        description: The role the party acts in, one of this class's descendants.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        designates_type: true
        owner: SlsaBuildImageProducer
        domain_of:
        - SlsaParty
        range: string
      party_name:
        name: party_name
        description: The party's name.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: SlsaBuildImageProducer
        domain_of:
        - SlsaParty
        range: string
  SlsaBuildImage:
    name: SlsaBuildImage
    description: 'The template a build environment is instantiated from, such as a
      VM or container image: root filesystem, guest OS and packages, build executor
      and build agent.'
    comments:
    - The Build Environment track is a working draft and not part of the SLSA v1.2
      release.
    in_subset:
    - slsa_build_environment_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#build-environment-model
    slots:
    - build_env_level
    attributes:
      image_uri:
        name: image_uri
        description: The URI that identifies the image version, such as an OCI reference
          with its digest.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build_environment
        identifier: true
        owner: SlsaBuildImage
        domain_of:
        - SlsaBuildImage
        range: uri
        required: true
      provenance:
        name: provenance
        description: The build provenance of the image itself, required at Build Environment
          L1.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build_environment
        owner: SlsaBuildImage
        domain_of:
        - SlsaBuildImage
        range: SlsaBuildProvenance
        inlined: true
      produced_by:
        name: produced_by
        description: The party that created and distributes the image.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build_environment
        owner: SlsaBuildImage
        domain_of:
        - SlsaBuildImage
        range: SlsaBuildImageProducer
        inlined: true
      build_env_level:
        name: build_env_level
        description: The SLSA Build Environment level this meets.
        in_subset:
        - slsa_build_environment_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:build_env_level
        owner: SlsaBuildImage
        domain_of:
        - SlsaBuildImage
        - SlsaBuildEnvironmentAttestation
        range: SlsaBuildEnvironmentLevel
  SlsaMeasurement:
    name: SlsaMeasurement
    description: The digest of one component or state of a build environment, to compare
      with its reference value.
    in_subset:
    - slsa_build_environment_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#build-environment-model
    slots:
    - digest
    attributes:
      measured_component:
        name: measured_component
        description: The component or state that was measured, such as the bootloader,
          guest kernel, build agent or root filesystem.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build_environment
        owner: SlsaMeasurement
        domain_of:
        - SlsaMeasurement
        range: string
        required: true
      digest:
        name: digest
        description: The cryptographic digests of a resource's content, keyed by algorithm.
        in_subset:
        - slsa_build_track
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:digest
        owner: SlsaMeasurement
        domain_of:
        - InTotoResourceDescriptor
        - SlsaMeasurement
        range: InTotoDigestSet
        inlined: true
  SlsaBuildEnvironmentAttestation:
    name: SlsaBuildEnvironmentAttestation
    description: 'Evidence of the state of a build environment when a build was dispatched
      to it: the image it came from and the measurements taken at boot.'
    comments:
    - The track names no single predicate type; platforms issue this evidence in formats
      such as SCAI or a VSA.
    in_subset:
    - slsa_build_environment_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#buildenv-levels
    is_a: SlsaPredicate
    slots:
    - build_env_level
    attributes:
      build_id:
        name: build_id
        description: The immutable identifier of the build execution the environment
          was assigned to.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build_environment
        owner: SlsaBuildEnvironmentAttestation
        domain_of:
        - SlsaBuildEnvironmentAttestation
        range: string
        required: true
      build_image:
        name: build_image
        description: The image the environment was instantiated from.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build_environment
        owner: SlsaBuildEnvironmentAttestation
        domain_of:
        - SlsaBuildEnvironmentAttestation
        range: SlsaBuildImage
      measurements:
        name: measurements
        description: The measurements of the environment's components taken during
          boot.
        from_schema: https://w3id.org/lmodel/slsa/slsa_build_environment
        owner: SlsaBuildEnvironmentAttestation
        domain_of:
        - SlsaBuildEnvironmentAttestation
        range: SlsaMeasurement
        multivalued: true
        inlined: true
        inlined_as_list: true
      build_env_level:
        name: build_env_level
        description: The SLSA Build Environment level this meets.
        in_subset:
        - slsa_build_environment_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:build_env_level
        owner: SlsaBuildEnvironmentAttestation
        domain_of:
        - SlsaBuildImage
        - SlsaBuildEnvironmentAttestation
        range: SlsaBuildEnvironmentLevel
      predicate_kind:
        name: predicate_kind
        description: The kind of predicate, one of this class's descendants.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        designates_type: true
        owner: SlsaBuildEnvironmentAttestation
        domain_of:
        - SlsaPredicate
        range: string
  SlsaAdoptionMetadata:
    name: SlsaAdoptionMetadata
    description: The adoption challenges a deployment meets and the strategies it
      applies, from the study's taxonomy.
    notes:
    - The study analysed 1,523 SLSA-related GitHub issues from 233 repositories and
      derived four challenge themes and five strategy themes.
    in_subset:
    - slsa_adoption_study
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://arxiv.org/abs/2409.05014
    attributes:
      challenges:
        name: challenges
        description: The challenge themes that apply.
        from_schema: https://w3id.org/lmodel/slsa/slsa_adoption
        owner: SlsaAdoptionMetadata
        domain_of:
        - SlsaAdoptionMetadata
        range: SlsaAdoptionChallenge
        multivalued: true
      strategies:
        name: strategies
        description: The strategy themes applied or recommended.
        from_schema: https://w3id.org/lmodel/slsa/slsa_adoption
        owner: SlsaAdoptionMetadata
        domain_of:
        - SlsaAdoptionMetadata
        range: SlsaAdoptionStrategy
        multivalued: true
metamodel_version: 1.12.0
source_file: src/slsa/schema/slsa.yaml

