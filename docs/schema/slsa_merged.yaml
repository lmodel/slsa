  InTotoDigestSet:
    name: InTotoDigestSet
    description: A set of one or more digests over one artifact, keyed by algorithm,
      from which a consumer picks the algorithm it trusts.
    notes:
    - Each condition in any_of names its range through a nested any_of, because the
      JSON Schema generator leaves a condition's own range out, and a null value would
      then count as present.
    comments:
    - The named algorithms take lowercase hexadecimal, and additional_digests holds
      any other algorithm, such as an SCS's own revision type.
    - A consumer accepts only the algorithms it considers secure and ignores the rest,
      and two sets match when any accepted algorithm matches.
    - SHAKE and BLAKE2 digests can be of any length, and this schema asks for at least
      32 bytes, since a shorter digest resists collisions too weakly to identify an
      artifact.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://github.com/in-toto/attestation/blob/main/spec/v1/digest_set.md
    attributes:
      sha256:
        name: sha256
        description: The SHA-256 digest of the artifact.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{64}$
      sha224:
        name: sha224
        description: The SHA-224 digest of the artifact.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{56}$
      sha384:
        name: sha384
        description: The SHA-384 digest of the artifact.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{96}$
      sha512:
        name: sha512
        description: The SHA-512 digest of the artifact.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{128}$
      sha512_224:
        name: sha512_224
        description: The SHA-512/224 digest of the artifact.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{56}$
      sha512_256:
        name: sha512_256
        description: The SHA-512/256 digest of the artifact.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{64}$
      sha3_224:
        name: sha3_224
        description: The SHA3-224 digest of the artifact.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{56}$
      sha3_256:
        name: sha3_256
        description: The SHA3-256 digest of the artifact.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{64}$
      sha3_384:
        name: sha3_384
        description: The SHA3-384 digest of the artifact.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{96}$
      sha3_512:
        name: sha3_512
        description: The SHA3-512 digest of the artifact.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{128}$
      shake128:
        name: shake128
        description: The SHAKE128 digest of the artifact, of at least 32 bytes.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{64}([a-f0-9]{2})*$
      shake256:
        name: shake256
        description: The SHAKE256 digest of the artifact, of at least 32 bytes.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{64}([a-f0-9]{2})*$
      blake2b:
        name: blake2b
        description: The BLAKE2b digest of the artifact, of 32 to 64 bytes.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{64}([a-f0-9]{2}){0,32}$
      blake2s:
        name: blake2s
        description: The BLAKE2s digest of the artifact, at its full 32 bytes.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{64}$
      ripemd160:
        name: ripemd160
        description: The RIPEMD-160 digest of the artifact.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{40}$
      sm3:
        name: sm3
        description: The SM3 digest of the artifact.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{64}$
      gost:
        name: gost
        description: The GOST R 34.11 digest of the artifact, of 256 or 512 bits.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{64}([a-f0-9]{64})?$
      sha1:
        name: sha1
        description: The SHA-1 digest of the artifact.
        comments:
        - SHA-1 lacks collision resistance, so most consumers should not rely on it.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{40}$
      md5:
        name: md5
        description: The MD5 digest of the artifact.
        comments:
        - MD5 lacks collision resistance, so most consumers should not accept it.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{32}$
      dir_hash:
        name: dir_hash
        description: A digest over a directory's content by the dirhash Hash1 function,
          in lowercase hexadecimal rather than base64.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{64}$
      git_commit:
        name: git_commit
        description: The git commit id of a source revision.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
      git_tree:
        name: git_tree
        description: The git tree id of a source revision's content, or of any file
          tree.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
      git_blob:
        name: git_blob
        description: The git blob id of a file's content.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
      git_tag:
        name: git_tag
        description: The git object id of an annotated tag.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: string
        pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
      additional_digests:
        name: additional_digests
        description: The digests under algorithms this class does not name.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoDigestSet
        domain_of:
        - InTotoDigestSet
        range: InTotoAdditionalDigest
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
    any_of:
    - slot_conditions:
        sha256:
          name: sha256
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha224:
          name: sha224
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha384:
          name: sha384
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha512:
          name: sha512
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha512_224:
          name: sha512_224
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha512_256:
          name: sha512_256
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha3_224:
          name: sha3_224
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha3_256:
          name: sha3_256
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha3_384:
          name: sha3_384
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha3_512:
          name: sha3_512
          required: true
          any_of:
          - range: string
    - slot_conditions:
        shake128:
          name: shake128
          required: true
          any_of:
          - range: string
    - slot_conditions:
        shake256:
          name: shake256
          required: true
          any_of:
          - range: string
    - slot_conditions:
        blake2b:
          name: blake2b
          required: true
          any_of:
          - range: string
    - slot_conditions:
        blake2s:
          name: blake2s
          required: true
          any_of:
          - range: string
    - slot_conditions:
        ripemd160:
          name: ripemd160
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sm3:
          name: sm3
          required: true
          any_of:
          - range: string
    - slot_conditions:
        gost:
          name: gost
          required: true
          any_of:
          - range: string
    - slot_conditions:
        sha1:
          name: sha1
          required: true
          any_of:
          - range: string
    - slot_conditions:
        md5:
          name: md5
          required: true
          any_of:
          - range: string
    - slot_conditions:
        dir_hash:
          name: dir_hash
          required: true
          any_of:
          - range: string
    - slot_conditions:
        git_commit:
          name: git_commit
          required: true
          any_of:
          - range: string
    - slot_conditions:
        git_tree:
          name: git_tree
          required: true
          any_of:
          - range: string
    - slot_conditions:
        git_blob:
          name: git_blob
          required: true
          any_of:
          - range: string
    - slot_conditions:
        git_tag:
          name: git_tag
          required: true
          any_of:
          - range: string
    - slot_conditions:
        additional_digests:
          name: additional_digests
          required: true
          multivalued: true
  InTotoAdditionalDigest:
    name: InTotoAdditionalDigest
    description: One digest under an algorithm that InTotoDigestSet does not name,
      such as an SCS's own revision type.
    comments:
    - In the attestation's JSON the algorithm is a key of the digest set beside the
      named ones, and an algorithm the framework does not define documents how its
      value is encoded.
    - An SCS that does not use cryptographic digests defines a canonical revision
      type of its own that includes the repository, such as svn_revision_id.
    - Each algorithm appears once in a list, since the attestation's JSON uses it
      as a key; the validator does not check this.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://github.com/in-toto/attestation/blob/main/spec/v1/digest_set.md
    - https://slsa.dev/spec/v1.2/source-requirements#source-verification-summary-attestation
    attributes:
      algorithm:
        name: algorithm
        description: The algorithm's name, as the key the attestation's JSON uses,
          such as svn_revision_id.
        comments:
        - An algorithm that InTotoDigestSet names, by its JSON key or by its field
          name, goes in that field instead.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoAdditionalDigest
        domain_of:
        - InTotoAdditionalDigest
        range: string
        required: true
        pattern: ^[a-z][A-Za-z0-9_]*$
        none_of:
        - equals_string_in:
          - sha256
          - sha224
          - sha384
          - sha512
          - sha512_224
          - sha512_256
          - sha3_224
          - sha3_256
          - sha3_384
          - sha3_512
          - shake128
          - shake256
          - blake2b
          - blake2s
          - ripemd160
          - sm3
          - gost
          - sha1
          - md5
          - dirHash
          - gitCommit
          - gitTree
          - gitBlob
          - gitTag
          - dir_hash
          - git_commit
          - git_tree
          - git_blob
          - git_tag
      value:
        name: value
        description: The digest under that algorithm, in the encoding the algorithm
          documents.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoAdditionalDigest
        domain_of:
        - InTotoAdditionalDigest
        range: string
        required: true
        pattern: ^\S+$
  InTotoAnnotation:
    name: InTotoAnnotation
    description: 'One vendor-specific annotation on a resource descriptor: a key and
      its values.'
    comments:
    - The attestation's JSON allows any JSON value. A string becomes one value and
      an array one value per item; any other value or item is written as its JSON
      text, so one value cannot tell a string from a one-item array.
    - Each key appears once in a list, since the attestation's JSON uses it as a key;
      the validator does not check this.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    from_schema: https://w3id.org/lmodel/slsa
    attributes:
      annotation_key:
        name: annotation_key
        description: The annotation's key.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoAnnotation
        domain_of:
        - InTotoAnnotation
        range: string
        required: true
      annotation_values:
        name: annotation_values
        description: The annotation's values.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoAnnotation
        domain_of:
        - InTotoAnnotation
        range: string
        multivalued: true
  InTotoResourceDescriptor:
    name: InTotoResourceDescriptor
    description: A reference to a software artifact or other resource by URI or digest,
      or the resource itself as content, with optional metadata.
    notes:
    - Each condition in any_of names its range through a nested any_of, because the
      JSON Schema generator leaves a condition's own range out, and a null value would
      then count as present.
    comments:
    - A descriptor carries at least one of a URI, a digest or its content; a field
      that needs a particular one says so.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    - slsa_dependency_track
    - slsa_build_environment_track
    from_schema: https://w3id.org/lmodel/slsa
    see_also:
    - https://github.com/in-toto/attestation/blob/main/spec/v1/resource_descriptor.md
    slots:
    - resource_uri
    - digest
    attributes:
      resource_name:
        name: resource_name
        description: A name for the resource within the attestation that carries it.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoResourceDescriptor
        domain_of:
        - InTotoResourceDescriptor
        range: string
      download_location:
        name: download_location
        description: Where the resource can be fetched, when that differs from its
          identifying URI.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoResourceDescriptor
        domain_of:
        - InTotoResourceDescriptor
        range: uri
      media_type:
        name: media_type
        description: The IANA media type of the resource's content.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoResourceDescriptor
        domain_of:
        - InTotoResourceDescriptor
        range: string
      content:
        name: content
        description: The resource's content itself, base64-encoded, for a resource
          small enough to carry inline.
        comments:
        - The in-toto framework asks for content under 1 KB, so that attestations
          stay small.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoResourceDescriptor
        domain_of:
        - InTotoResourceDescriptor
        range: string
        pattern: ^[A-Za-z0-9+/_-]+={0,2}$
      annotations:
        name: annotations
        description: Vendor-specific annotations on the resource, such as the source
          references a Source VSA records.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoResourceDescriptor
        domain_of:
        - InTotoResourceDescriptor
        range: InTotoAnnotation
        multivalued: true
        inlined: true
        inlined_as_list: true
      resource_uri:
        name: resource_uri
        description: The URI that identifies a resource, such as a package URL, a
          git repository address or an OCI image reference.
        in_subset:
        - slsa_build_track
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:resource_uri
        owner: InTotoResourceDescriptor
        domain_of:
        - InTotoResourceDescriptor
        - SlsaVerificationSummary
        range: uri
      digest:
        name: digest
        description: The cryptographic digests of a resource's content, keyed by algorithm.
        in_subset:
        - slsa_build_track
        - slsa_source_track
        from_schema: https://w3id.org/lmodel/slsa
        slot_uri: slsa:digest
        owner: InTotoResourceDescriptor
        domain_of:
        - InTotoResourceDescriptor
        - SlsaMeasurement
        range: InTotoDigestSet
        inlined: true
    any_of:
    - slot_conditions:
        resource_uri:
          name: resource_uri
          required: true
          any_of:
          - range: uri
    - slot_conditions:
        digest:
          name: digest
          required: true
          any_of:
          - range: InTotoDigestSet
    - slot_conditions:
        content:
          name: content
          required: true
          any_of:
          - range: string
