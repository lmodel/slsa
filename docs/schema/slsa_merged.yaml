        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoStatementSubject
        domain_of:
        - InTotoResourceDescriptor
        range: string
      content:
        name: content
        description: The resource's content itself, base64-encoded, for a resource
          small enough to carry inline.
        comments:
        - The in-toto framework asks for content under 1 KB, so that attestations
          stay small.
        from_schema: https://w3id.org/lmodel/slsa/slsa_core
        owner: InTotoStatementSubject
        domain_of:
        - InTotoResourceDescriptor
        range: string
        pattern: ^[A-Za-z0-9+/_-]+={0,2}$
      annotations:
        name: annotations
        description: Vendor-specific annotations on the resource, such as the source
