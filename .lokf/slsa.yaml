# Generated by `lokf adapt` from slsa.yaml (slsa 1.2.0); do not edit.
# Imports lokf: a domain schema lists this file beside it (SPEC 6.2).
id: https://w3id.org/lmodel/slsa-lokf
name: slsa
title: Supply-chain Levels for Software Artifacts (SLSA)
description: 'A LinkML model of the SLSA specification: its tracks and levels, the roles and systems in
  a software supply chain, and the in-toto attestations that carry build provenance and verification summaries.'
version: 1.2.0
source: https://slsa.dev/spec/v1.2
license: Apache-2.0
see_also:
- https://lmodel.github.io/slsa
- https://slsa.dev/spec/v1.2/
- https://github.com/slsa-framework/slsa
comments:
- The version is the SLSA specification version the model renders. The Dependency and Build Environment
  tracks follow the working draft at that version, which the release does not include.
- slsa_core imports only the LinkML types, each track module imports the core, and this file adds only
  the document root, so an importer can take one module.
default_prefix: slsa
default_range: string
prefixes:
  linkml: https://w3id.org/linkml/
  slsa: https://w3id.org/lmodel/slsa/
imports:
- linkml:types
- lokf
classes:
  InTotoDigestSet:
    description: A set of digests over one artifact, keyed by algorithm, from which a consumer picks the
      algorithm it trusts.
    see_also:
    - https://github.com/in-toto/attestation/blob/main/spec/v1/digest_set.md
    comments:
    - Digests are lowercase hexadecimal. The in-toto framework defines more algorithms than the five modelled
      here.
    attributes:
      sha256:
        description: The SHA-256 digest of the artifact.
        pattern: ^[a-f0-9]{64}$
      sha512:
        description: The SHA-512 digest of the artifact.
        pattern: ^[a-f0-9]{128}$
      git_commit:
        description: The git commit id of a source revision.
        pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
      git_tree:
        description: The git tree id of a source revision's content.
        pattern: ^[a-f0-9]{40}([a-f0-9]{24})?$
      dir_hash:
        description: A digest over a directory's content, as the in-toto framework defines it.
    in_subset:
    - slsa_build_track
    - slsa_source_track
  InTotoAnnotation:
    description: One vendor-specific annotation on a resource descriptor, with a key and one or more values.
    attributes:
      annotation_key:
        description: The annotation's key.
        required: true
      annotation_values:
        description: The annotation's values.
        multivalued: true
    in_subset:
    - slsa_build_track
    - slsa_source_track
  InTotoResourceDescriptor:
    description: A reference to a software artifact or other resource, by URI, by digest, or both, with
      optional metadata.
    see_also:
    - https://github.com/in-toto/attestation/blob/main/spec/v1/resource_descriptor.md
    comments:
    - A descriptor needs a URI, a digest or both; which one a field requires is said on that field.
    slots:
    - resource_uri
    - digest
    attributes:
      resource_name:
        description: A name for the resource within the attestation that carries it.
      download_location:
        description: Where the resource can be fetched, when that differs from its identifying URI.
        range: uri
      media_type:
        description: The IANA media type of the resource's content.
      annotations:
        description: Vendor-specific annotations on the resource, such as the source references a Source
          VSA records.
        range: InTotoAnnotation
        multivalued: true
        inlined: true
        inlined_as_list: true
    in_subset:
    - slsa_build_track
    - slsa_source_track
    - slsa_dependency_track
    - slsa_build_environment_track
  InTotoStatement:
    description: 'The statement layer of an in-toto attestation: the subjects it is about, the type of
      its predicate and the predicate itself.'
    see_also:
    - https://github.com/in-toto/attestation/blob/main/spec/v1/statement.md
    - https://slsa.dev/spec/v1.2/attestation-model
    comments:
    - The signature envelope around a statement is outside this model.
    - Attestation and provenance are often confused; a statement is the attestation, and build provenance
      is one kind of predicate it may carry (Tamanna et al., 2024, UC.1).
    attributes:
      statement_type:
        description: The in-toto statement type, always https://in-toto.io/Statement/v1.
        range: uri
        required: true
        pattern: ^https://in-toto\.io/Statement/v1$
      subject:
        description: The artifacts the predicate is about; each carries a digest.
        range: InTotoResourceDescriptor
        multivalued: true
        required: true
        inlined: true
        inlined_as_list: true
      predicate_type:
        description: The URI that names the predicate's type and so its schema, such as https://slsa.dev/provenance/v1.
        range: uri
        required: true
      predicate:
        description: The predicate, one of the kinds this schema models; predicate_kind names which.
        range: SlsaPredicate
        inlined: true
      attestation_storage_uri:
        description: Where the signed attestation is stored or can be fetched.
        range: uri
        comments:
        - SLSA names no standard place to store attestations; recording the place used helps consumers
          find them (Tamanna et al., 2024, LF.1).
        in_subset:
        - slsa_adoption_study
      signing_tool:
        description: The tool that signed the attestation, named by URI, such as Cosign or Notation.
        range: uri
        in_subset:
        - slsa_ssf
      transparency_log_entry:
        description: The transparency log entry that records the signature, such as a Rekor entry.
        range: uri
        in_subset:
        - slsa_ssf
    in_subset:
    - slsa_build_track
    - slsa_source_track
    - slsa_build_environment_track
  SlsaPredicate:
    abstract: true
    description: The base of every predicate this schema models; predicate_kind names the concrete kind.
    attributes:
      predicate_kind:
        description: The kind of predicate, one of this class's descendants.
        range: string
    in_subset:
    - slsa_build_track
    - slsa_source_track
    - slsa_build_environment_track
  SlsaParty:
    abstract: true
    description: A person or organization that takes part in a software supply chain, in one of the roles
      SLSA names.
    see_also:
    - https://slsa.dev/spec/v1.2/terminology#roles
    comments:
    - One party may act in several roles, and several parties may share one role.
    attributes:
      party_type:
        description: The role the party acts in, one of this class's descendants.
        range: string
      party_name:
        description: The party's name.
    in_subset:
    - slsa_build_track
    - slsa_source_track
    is_a: Concept
  SlsaProducer:
    is_a: SlsaParty
    description: A party that creates software and provides it to others, choosing a build platform and
      distributing provenance.
    slots:
    - build_platform
    in_subset:
    - slsa_build_track
  SlsaConsumer:
    is_a: SlsaParty
    description: A party that uses software a producer provides, verifying its provenance itself or through
      a verifier.
    in_subset:
    - slsa_build_track
    - slsa_source_track
  SlsaVerifier:
    is_a: SlsaParty
    description: A party that inspects provenance or other attestations and decides whether an artifact
      is authentic.
    see_also:
    - https://slsa.dev/spec/v1.2/verification_summary#verifier
    comments:
    - Consumers accept only specific signer and verifier pairs.
    slots:
    - component_versions
    attributes:
      verifier_id:
        description: The URI that identifies the verifier.
        range: uri
        required: true
    in_subset:
    - slsa_build_track
    - slsa_source_track
  SlsaInfrastructureProvider:
    is_a: SlsaParty
    description: A party that provides software or services to the other roles, such as a package registry's
      or a build platform's maintainers.
    in_subset:
    - slsa_build_track
    - slsa_source_track
  SlsaBuildPlatform:
    description: 'The system that runs builds and records their provenance: the transitive closure of
      software, hardware, people and organizations trusted to do so. Provenance names it as the builder.'
    see_also:
    - https://slsa.dev/spec/v1.2/terminology#build-model
    - https://slsa.dev/spec/v1.2/build-provenance#builder
    comments:
    - A platform with several modes of operation at different levels has a different builder_id for each.
    slots:
    - component_versions
    - id
    attributes:
      build_level:
        description: The highest SLSA Build level the platform's provenance can meet.
        range: SlsaBuildLevel
      hosted:
        description: Whether the platform is a hosted service on shared or dedicated infrastructure rather
          than an individual's workstation.
        range: boolean
        comments:
        - Build L2 and above require a hosted platform.
      builder_dependencies:
        description: Dependencies of the platform's orchestrator that do not run inside the build but
          may affect provenance generation or its guarantees.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
    in_subset:
    - slsa_build_track
    is_a: Concept
  SlsaControlPlane:
    description: The component of a build platform that orchestrates each build and generates its provenance,
      outside the tenant's control.
    see_also:
    - https://slsa.dev/spec/v1.2/terminology#build-model
    slots:
    - build_platform
    in_subset:
    - slsa_build_track
    is_a: Concept
  SlsaComponentVersion:
    description: The version of one named component of a platform.
    attributes:
      component:
        description: The component's name.
        required: true
      component_version:
        description: The component's version string.
    in_subset:
    - slsa_build_track
  SlsaPackageRegistry:
    description: A distribution platform that resolves package names to immutable package artifacts within
      an ecosystem.
    see_also:
    - https://slsa.dev/spec/v1.2/terminology#distribution-model
    slots:
    - ecosystem
    - id
    attributes: {}
    in_subset:
    - slsa_build_track
    - slsa_dependency_track
    is_a: Concept
  SlsaPackage:
    description: A unit of software distributed under a package name, which is the primary security boundary
      SLSA protects. Its artifacts are the outputs of builds.
    see_also:
    - https://slsa.dev/spec/v1.2/terminology#distribution-model
    slots:
    - ecosystem
    attributes:
      package_name:
        description: The name consumers use to obtain the package within its ecosystem and registry.
        required: true
      registry:
        description: The registry the package is published to.
        range: SlsaPackageRegistry
      package_artifacts:
        description: The immutable artifacts the package name has resolved to.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
      guac_uri:
        description: Where a GUAC instance answers queries about the package's dependency and provenance
          graph.
        range: uri
        in_subset:
        - slsa_ssf
      security_insights_uri:
        description: The SECURITY-INSIGHTS.yml file of the project that produces the package.
        range: uri
        in_subset:
        - slsa_ssf
    in_subset:
    - slsa_build_track
    - slsa_dependency_track
    is_a: Concept
  SlsaBuildProvenance:
    is_a: SlsaPredicate
    description: The predicate that says how a build platform produced a set of artifacts, so that consumers
      can verify the build met their expectations and others can rebuild it.
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#provenance
    comments:
    - The statement that carries it has predicate_type https://slsa.dev/provenance/v1.
    - Generating valid provenance was the most frequent adoption difficulty practitioners reported (Tamanna
      et al., 2024, CI.1).
    attributes:
      build_definition:
        description: The inputs to the build; required at Build L1.
        range: SlsaBuildDefinition
        required: true
        inlined: true
      run_details:
        description: What is specific to this execution of the build; required at Build L1.
        range: SlsaRunDetails
        required: true
        inlined: true
    in_subset:
    - slsa_build_track
  SlsaBuildDefinition:
    description: The inputs to a build, in enough detail to initialize it and begin execution; the builder
      vouches for their accuracy.
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#builddefinition
    attributes:
      build_type:
        description: The URI of the template that says how to run the build and read its parameters and
          dependencies; required at Build L1.
        range: uri
        required: true
      external_parameters:
        description: The inputs under the tenant's control; complete at Build L3 and verified by consumers.
        range: SlsaBuildParameter
        multivalued: true
        inlined: true
        inlined_as_list: true
        comments:
        - Verifiers reject parameters they do not recognize here.
      internal_parameters:
        description: The inputs the platform sets itself; kept for debugging, incident response and reproduction,
          and not verified by consumers.
        range: SlsaBuildParameter
        multivalued: true
        inlined: true
        inlined_as_list: true
      resolved_dependencies:
        description: The artifacts fetched during the build, as far as the platform knows them; completeness
          is best effort through Build L3.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
      hermetic:
        description: Whether the build could reach only the dependencies it declared, with no other network
          or filesystem access.
        range: boolean
        comments:
        - Hermetic builds are an isolation property Build L3 platforms aim for, and the one practitioners
          found hardest (Tamanna et al., 2024, CI.1).
        in_subset:
        - slsa_adoption_study
      provenance_generation_tool:
        description: The tool that generated this provenance, named by URI.
        range: uri
        comments:
        - Naming the generator supports the strategy of standardizing provenance generation (Tamanna et
          al., 2024, S3.1).
        in_subset:
        - slsa_adoption_study
      pipeline_orchestrator:
        description: The CI/CD system that coordinated the build, named by URI, where it differs from
          the builder.
        range: uri
        comments:
        - In the Secure Software Factory architecture this is the Build Service layer, distinct from the
          provenance-generating builder.
        in_subset:
        - slsa_ssf
    in_subset:
    - slsa_build_track
  SlsaBuildParameter:
    description: One named input to a build, with a string value.
    comments:
    - The specification recommends string values; a structured value is written as its JSON text.
    attributes:
      parameter_name:
        description: The parameter's name.
        required: true
      parameter_value:
        description: The parameter's value.
    in_subset:
    - slsa_build_track
  SlsaRunDetails:
    description: 'What is specific to one execution of a build: the platform that ran it, metadata about
      the run and its by-products.'
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#rundetails
    attributes:
      builder:
        description: The build platform that ran the build and is trusted to have written this provenance;
          required at Build L1.
        range: SlsaBuildPlatform
        required: true
        inlined: true
      build_metadata:
        description: Metadata about this execution of the build.
        range: SlsaBuildMetadata
        inlined: true
      byproducts:
        description: Artifacts the build produced beside its outputs that may help debugging or incident
          response, such as logs.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
    in_subset:
    - slsa_build_track
  SlsaBuildMetadata:
    description: 'Metadata about one execution of a build: its identifier and when it started and finished.'
    see_also:
    - https://slsa.dev/spec/v1.2/build-provenance#buildmetadata
    attributes:
      invocation_id:
        description: An identifier for this build invocation, in a format the builder defines; useful
          for finding its logs.
      started_on:
        description: When the build started.
        range: datetime
      finished_on:
        description: When the build finished.
        range: datetime
    in_subset:
    - slsa_build_track
  SlsaVerificationSummary:
    is_a: SlsaPredicate
    description: The predicate in which a verifier records that it evaluated artifacts against a policy
      and the SLSA levels they met, so consumers can rely on the verifier instead of reading every underlying
      attestation.
    see_also:
    - https://slsa.dev/spec/v1.2/verification_summary
    - https://slsa.dev/spec/v1.2/source-requirements#source-verification-summary-attestation
    comments:
    - The statement that carries it has predicate_type https://slsa.dev/verification_summary/v1.
    - A Source VSA is this predicate with the repository as resource_uri and the revision id in the subject's
      digest.
    - Verification tooling and the places attestations are stored were an adoption difficulty practitioners
      reported (Tamanna et al., 2024, LF.1).
    slots:
    - resource_uri
    slot_usage:
      resource_uri:
        description: The URI consumers fetch the artifact from, which the verifier verified it as.
        required: true
    attributes:
      verifier:
        description: The verifier that made this determination.
        range: SlsaVerifier
        required: true
        inlined: true
      time_verified:
        description: When the verification happened.
        range: datetime
      policy:
        description: The policy the subject was verified against, by URI and preferably by digest too.
        range: InTotoResourceDescriptor
        required: true
        inlined: true
      input_attestations:
        description: Every attestation the verifier consulted, each with a digest; complete when present.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
      verification_result:
        description: Whether the subject passed the policy.
        range: SlsaVerificationResult
        required: true
      verified_levels:
        description: The highest level verified in each track, and any verified property; a level implies
          the levels below it.
        range: SlsaResult
        multivalued: true
        required: true
      organization_properties:
        description: Properties an organization defines for its own consumers, each prefixed ORG_SOURCE_.
        multivalued: true
        pattern: ^ORG_SOURCE_
        in_subset:
        - slsa_source_track
      dependency_levels:
        description: How many transitive dependencies were verified at each level; absent when the verifier
          makes no claim about dependencies.
        range: SlsaDependencyLevelCount
        multivalued: true
        inlined: true
        inlined_as_list: true
      slsa_version:
        description: The SLSA specification version the verifier applied, as MAJOR.MINOR.
        pattern: ^[0-9]+\.[0-9]+$
    in_subset:
    - slsa_build_track
    - slsa_source_track
  SlsaDependencyLevelCount:
    description: The number of an artifact's transitive dependencies verified at one level, each counted
      once per track at its highest level.
    attributes:
      verified_level:
        description: The level the dependencies were verified at.
        range: SlsaResult
        required: true
      dependency_count:
        description: How many dependencies were verified at that level.
        range: integer
        minimum_value: 0
        required: true
    in_subset:
    - slsa_build_track
  SlsaSourceControlSystem:
    description: The platform or services that host a source repository and enforce its organization's
      policies on authentication, authorization and change management.
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    comments:
    - The SCS issues the Source VSAs and source provenance for the revisions it hosts.
    attributes: {}
    in_subset:
    - slsa_source_track
    slots:
    - id
    is_a: Concept
  SlsaSourceRepository:
    description: A self-contained unit that holds a set of files, their revision history and metadata
      such as branches and tags.
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    attributes:
      hosted_by:
        description: The source control system that hosts the repository.
        range: SlsaSourceControlSystem
    in_subset:
    - slsa_source_track
    slots:
    - id
    is_a: Concept
  SlsaSourceRevision:
    description: 'A logically immutable snapshot of a repository''s tracked files, with its version-control
      metadata: author, time and parent revisions.'
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    comments:
    - A revision id is unique within its repository and may recur in another; a document that holds revisions
      from several repositories qualifies them.
    slots:
    - repository
    - id
    attributes:
      authored_by:
        description: The identity of the person or automation that authored the revision.
      authored_at:
        description: When the revision was created.
        range: datetime
      parent_revisions:
        description: The revisions this one descends from, which together form the change history.
        range: SlsaSourceRevision
        multivalued: true
      source_level:
        description: The SLSA Source level the SCS asserts for the revision.
        range: SlsaSourceLevel
      review_type:
        description: The form of review that approved the revision.
        range: SlsaReviewType
        in_subset:
        - slsa_adoption_study
    in_subset:
    - slsa_source_track
    is_a: Concept
  SlsaNamedReference:
    description: A user-friendly name for a revision in a repository, such as main or v1.2.3; reference_type
      says whether it is a branch or a tag.
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#definitions
    slots:
    - repository
    - revision
    attributes:
      reference_type:
        description: The kind of named reference, one of this class's descendants.
        range: string
      reference_name:
        description: The reference's name, fully qualified in git, such as refs/heads/main.
        required: true
      protected:
        description: Whether the organization has the SCS enforce its technical controls on this reference.
        range: boolean
    in_subset:
    - slsa_source_track
  SlsaBranch:
    is_a: SlsaNamedReference
    description: A named reference that moves to track a line of development.
    in_subset:
    - slsa_source_track
  SlsaTag:
    is_a: SlsaNamedReference
    description: A named reference meant never to move once created.
    comments:
    - A version-control tag that is allowed to move, such as latest, is a named reference and not a tag
      in this sense.
    in_subset:
    - slsa_source_track
  SlsaSourceProvenance:
    is_a: SlsaPredicate
    description: Evidence from an SCS of how a revision came to exist and which technical controls were
      enforced when it did.
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#source-provenance-attestations
    comments:
    - SLSA leaves the format of source provenance to each SCS and defines no predicate type for it; this
      class holds what the specification says such provenance conveys.
    - Source L2 and above require the SCS to issue it with each new revision.
    slots:
    - revision
    slot_usage:
      revision:
        required: true
    attributes:
      controls_enforced:
        description: The technical controls the SCS enforced when the revision was created, as the organization
          documents them.
        multivalued: true
        comments:
        - Two-party review is a control many single-maintainer projects cannot meet (Tamanna et al., 2024,
          LF.2).
    in_subset:
    - slsa_source_track
  SlsaDependencyInventory:
    description: The inventory of every third-party build dependency, direct and transitive, of one artifact
      version.
    see_also:
    - https://slsa.dev/spec/draft/dependency-track
    comments:
    - The Dependency track is a working draft and not part of the SLSA v1.2 release.
    - A build-time SBOM or a lock file with hashes is a common form of the inventory.
    attributes:
      artifact:
        description: The artifact whose dependencies are inventoried.
        range: InTotoResourceDescriptor
        required: true
        inlined: true
      dependencies:
        description: The dependencies, each identified by URI and digest.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
      dependency_level:
        description: The SLSA Dependency level the producer's process meets for this artifact.
        range: SlsaDependencyLevel
    in_subset:
    - slsa_dependency_track
  SlsaBuildImageProducer:
    is_a: SlsaParty
    description: The party that creates and distributes build images; the hosted build platform itself,
      or a third party in a bring-your-own-image setting.
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#build-environment-model
    in_subset:
    - slsa_build_environment_track
  SlsaBuildImage:
    description: 'The template a build environment is instantiated from, such as a VM or container image:
      root filesystem, guest OS and packages, build executor and build agent.'
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#build-environment-model
    comments:
    - The Build Environment track is a working draft and not part of the SLSA v1.2 release.
    slots:
    - build_env_level
    - id
    attributes:
      provenance:
        description: The build provenance of the image itself, required at Build Environment L1.
        range: SlsaBuildProvenance
        inlined: true
      produced_by:
        description: The party that created and distributes the image.
        range: SlsaBuildImageProducer
        inlined: true
    in_subset:
    - slsa_build_environment_track
    is_a: Concept
  SlsaMeasurement:
    description: The digest of one component or state of a build environment, to compare with its reference
      value.
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#build-environment-model
    slots:
    - digest
    attributes:
      measured_component:
        description: The component or state that was measured, such as the bootloader, guest kernel, build
          agent or root filesystem.
        required: true
    in_subset:
    - slsa_build_environment_track
  SlsaBuildEnvironmentAttestation:
    is_a: SlsaPredicate
    description: 'Evidence of the state of a build environment when a build was dispatched to it: the
      image it came from and the measurements taken at boot.'
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#buildenv-levels
    comments:
    - The track names no single predicate type; platforms issue this evidence in formats such as SCAI
      or a VSA.
    slots:
    - build_env_level
    attributes:
      build_id:
        description: The immutable identifier of the build execution the environment was assigned to.
        required: true
      build_image:
        description: The image the environment was instantiated from.
        range: SlsaBuildImage
      measurements:
        description: The measurements of the environment's components taken during boot.
        range: SlsaMeasurement
        multivalued: true
        inlined: true
        inlined_as_list: true
    in_subset:
    - slsa_build_environment_track
  SlsaAdoptionMetadata:
    description: The adoption challenges a deployment meets and the strategies it applies, from the study's
      taxonomy.
    see_also:
    - https://arxiv.org/abs/2409.05014
    notes:
    - The study analysed 1,523 SLSA-related GitHub issues from 233 repositories and derived four challenge
      themes and five strategy themes.
    attributes:
      challenges:
        description: The challenge themes that apply.
        range: SlsaAdoptionChallenge
        multivalued: true
      strategies:
        description: The strategy themes applied or recommended.
        range: SlsaAdoptionStrategy
        multivalued: true
    in_subset:
    - slsa_adoption_study
  SlsaDocument:
    description: A document that holds SLSA attestations and the parties, platforms, packages, repositories
      and images they concern.
    attributes:
      attestations:
        description: The attestations, as in-toto statements.
        range: InTotoStatement
        multivalued: true
        inlined: true
        inlined_as_list: true
      parties:
        description: The parties, each in its role.
        range: SlsaParty
        multivalued: true
        inlined: true
        inlined_as_list: true
      build_platforms:
        description: The build platforms.
        range: SlsaBuildPlatform
        multivalued: true
        inlined: true
        inlined_as_list: true
      packages:
        description: The packages.
        range: SlsaPackage
        multivalued: true
        inlined: true
        inlined_as_list: true
      package_registries:
        description: The package registries.
        range: SlsaPackageRegistry
        multivalued: true
        inlined: true
        inlined_as_list: true
      source_control_systems:
        description: The source control systems.
        range: SlsaSourceControlSystem
        multivalued: true
        inlined: true
        inlined_as_list: true
      source_repositories:
        description: The source repositories.
        range: SlsaSourceRepository
        multivalued: true
        inlined: true
        inlined_as_list: true
      source_revisions:
        description: The source revisions.
        range: SlsaSourceRevision
        multivalued: true
        inlined: true
        inlined_as_list: true
      named_references:
        description: The branches and tags.
        range: SlsaNamedReference
        multivalued: true
        inlined: true
        inlined_as_list: true
      build_images:
        description: The build images.
        range: SlsaBuildImage
        multivalued: true
        inlined: true
        inlined_as_list: true
      dependency_inventories:
        description: The dependency inventories.
        range: SlsaDependencyInventory
        multivalued: true
        inlined: true
        inlined_as_list: true
      adoption_metadata:
        description: How the deployment the document describes fares against the adoption study's themes.
        range: SlsaAdoptionMetadata
        inlined: true
slots:
  resource_uri:
    description: The URI that identifies a resource, such as a package URL, a git repository address or
      an OCI image reference.
    slot_uri: slsa:resource_uri
    range: uri
    in_subset:
    - slsa_build_track
    - slsa_source_track
  digest:
    description: The cryptographic digests of a resource's content, keyed by algorithm.
    slot_uri: slsa:digest
    range: InTotoDigestSet
    inlined: true
    in_subset:
    - slsa_build_track
    - slsa_source_track
  component_versions:
    description: The version of each named component of a platform.
    slot_uri: slsa:component_versions
    range: SlsaComponentVersion
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
    - slsa_build_track
  ecosystem:
    description: The package ecosystem whose rules govern how a package is named and distributed, such
      as PyPA, npm or OCI.
    slot_uri: slsa:ecosystem
    comments:
    - The same source can yield differently named packages in one ecosystem, so verifiers match provenance
      to package names with care (Tamanna et al., 2024, UR.1).
    in_subset:
    - slsa_build_track
    - slsa_dependency_track
  build_platform:
    description: The build platform this party or component belongs to or uses.
    slot_uri: slsa:build_platform
    range: SlsaBuildPlatform
    in_subset:
    - slsa_build_track
  repository:
    description: The source repository this belongs to.
    slot_uri: slsa:repository
    range: SlsaSourceRepository
    in_subset:
    - slsa_source_track
  revision:
    description: The source revision this refers to.
    slot_uri: slsa:revision
    range: SlsaSourceRevision
    in_subset:
    - slsa_source_track
  build_env_level:
    description: The SLSA Build Environment level this meets.
    slot_uri: slsa:build_env_level
    range: SlsaBuildEnvironmentLevel
    in_subset:
    - slsa_build_environment_track
enums:
  SlsaBuildLevel:
    description: The levels of the SLSA Build track, each adding protection against tampering with the
      build or its provenance.
    see_also:
    - https://slsa.dev/spec/v1.2/build-track-basics
    permissible_values:
      SLSA_BUILD_LEVEL_0:
        description: No requirements; the absence of SLSA, as for development or test builds.
      SLSA_BUILD_LEVEL_1:
        description: Provenance exists and shows how the package was built; it prevents mistakes but is
          easy to forge.
      SLSA_BUILD_LEVEL_2:
        description: A hosted platform generates and signs the provenance, so tampering after the build
          needs an explicit attack.
        comments:
        - Integrating signing tools into varied CI workflows is a common adoption difficulty (Tamanna
          et al., 2024, CI.2).
      SLSA_BUILD_LEVEL_3:
        description: A hardened platform prevents runs from influencing one another and keeps signing
          material away from build steps, so forging provenance needs an exploit.
        comments:
        - Hermetic and isolated builds were the adoption barrier practitioners cited most (Tamanna et
          al., 2024, CI.1).
    in_subset:
    - slsa_build_track
  SlsaVerificationResult:
    description: The outcome of verifying an artifact against a policy.
    permissible_values:
      PASSED:
        description: The artifact met the policy.
      FAILED:
        description: The artifact did not meet the policy.
    in_subset:
    - slsa_build_track
    - slsa_source_track
  SlsaResult:
    description: 'A result of evaluating an artifact against SLSA: a track level, a verified property,
      or a failure. A level implies the levels below it in the same track.'
    see_also:
    - https://slsa.dev/spec/v1.2/verification_summary#slsaresult
    - https://slsa.dev/spec/draft/verified-properties
    comments:
    - Issuers may add values of their own, but none that start with SLSA_; this enum lists the SLSA-defined
      values.
    permissible_values:
      SLSA_BUILD_LEVEL_UNEVALUATED:
        description: The issuer makes no claim about the Build track level.
      SLSA_BUILD_LEVEL_0:
        description: No Build track guarantees were verified.
      SLSA_BUILD_LEVEL_1:
        description: Build level 1 was verified.
      SLSA_BUILD_LEVEL_2:
        description: Build level 2 was verified.
      SLSA_BUILD_LEVEL_3:
        description: Build level 3 was verified.
      SLSA_SOURCE_LEVEL_UNEVALUATED:
        description: The issuer makes no claim about the Source track level.
      SLSA_SOURCE_LEVEL_0:
        description: No Source track guarantees were verified.
      SLSA_SOURCE_LEVEL_1:
        description: Source level 1 was verified.
      SLSA_SOURCE_LEVEL_2:
        description: Source level 2 was verified.
      SLSA_SOURCE_LEVEL_3:
        description: Source level 3 was verified.
      SLSA_SOURCE_LEVEL_4:
        description: Source level 4 was verified.
      SLSA_SOURCE_TWO_PARTY_REVIEWED:
        description: The verified property that two trusted persons reviewed the source, at whatever source
          level.
      SLSA_BUILD_REPRODUCED:
        description: The verified property that two or more independent build platforms reproduced the
          artifact.
      FAILED:
        description: Policy evaluation failed.
    in_subset:
    - slsa_build_track
    - slsa_source_track
  SlsaSourceLevel:
    description: The levels of the SLSA Source track, each adding trust in how a revision was created.
    see_also:
    - https://slsa.dev/spec/v1.2/source-requirements#basics
    permissible_values:
      SLSA_SOURCE_LEVEL_0:
        description: No Source track claims; the SCS issued no VSA for the revision.
      SLSA_SOURCE_LEVEL_1:
        description: The source is managed in a version control system, so it has discrete, immutable
          revisions.
      SLSA_SOURCE_LEVEL_2:
        description: Branch history is continuous and retained, and the SCS issues source provenance for
          each new revision.
      SLSA_SOURCE_LEVEL_3:
        description: The SCS enforces the organization's technical controls on protected named references
          and provides evidence of them.
      SLSA_SOURCE_LEVEL_4:
        description: Two trusted persons agree to every change on protected branches.
        comments:
        - Whether pair or mob programming counts as two-party review is an open question (Tamanna et al.,
          2024, LF.2).
    in_subset:
    - slsa_source_track
  SlsaReviewType:
    description: The forms of review that may approve a revision, including the contested forms the adoption
      study records.
    see_also:
    - https://arxiv.org/abs/2409.05014
    annotations:
      study_theme: LF.2
    permissible_values:
      TWO_PARTY:
        description: A reviewer distinct from the author approved the change, both being trusted persons.
      PAIR_PROGRAMMING:
        description: Two developers wrote the change together at one workstation or screen; whether this
          counts as two-party review is open.
      MOB_PROGRAMMING:
        description: A group wrote the change together; whether this counts as two-party review is open.
      AUTOMATED:
        description: A tool or bot reviewed the change with no second person, which does not meet Source
          L4.
    in_subset:
    - slsa_source_track
    - slsa_adoption_study
  SlsaDependencyLevel:
    description: The levels of the SLSA Dependency track, each reducing the risk third-party dependencies
      bring.
    see_also:
    - https://slsa.dev/spec/draft/dependency-track#levels
    permissible_values:
      SLSA_DEPENDENCY_LEVEL_0:
        description: No Dependency track claims.
      SLSA_DEPENDENCY_LEVEL_1:
        description: An inventory of all build dependencies, direct and transitive, exists.
      SLSA_DEPENDENCY_LEVEL_2:
        description: Every known vulnerability in the dependencies was triaged before release.
      SLSA_DEPENDENCY_LEVEL_3:
        description: Every third-party build dependency is consumed from a location the producer controls.
      SLSA_DEPENDENCY_LEVEL_4:
        description: An ingestion policy keeps compromised upstream dependencies out of the build.
    in_subset:
    - slsa_dependency_track
  SlsaBuildEnvironmentLevel:
    description: The levels of the SLSA Build Environment track, each extending integrity further into
      the compute that runs builds.
    see_also:
    - https://slsa.dev/spec/draft/build-env-track-basics#track-overview
    permissible_values:
      SLSA_BUILD_ENV_LEVEL_0:
        description: No Build Environment track claims.
      SLSA_BUILD_ENV_LEVEL_1:
        description: The build image has signed build provenance, protecting against tampering while the
          image is distributed.
      SLSA_BUILD_ENV_LEVEL_2:
        description: The compute platform attests to the environment's state at boot, protecting against
          tampering through the control plane.
      SLSA_BUILD_ENV_LEVEL_3:
        description: Trusted hardware attests to the host's state, protecting against tampering through
          the host interface.
    in_subset:
    - slsa_build_environment_track
  SlsaAdoptionChallenge:
    description: The four themes of difficulty practitioners met when adopting SLSA.
    see_also:
    - https://arxiv.org/abs/2409.05014
    permissible_values:
      COMPLEX_IMPLEMENTATION:
        description: Generating provenance and maintaining the required tools is complicated.
        annotations:
          study_theme: CI
        comments:
        - 'Sub-themes: complicated provenance generation (CI.1) and intricate tool maintenance (CI.2);
          901 issues.'
      UNCLEAR_COMMUNICATION:
        description: SLSA's terms and its guidance for particular ecosystems are hard to understand.
        annotations:
          study_theme: UC
        comments:
        - 'Sub-themes: unclear definitions of key terms (UC.1) and a lack of ecosystem- specific guidance
          (UC.2); 357 issues.'
      LIMITED_FEASIBILITY:
        description: Verification tooling, attestation storage and two-party review are hard to put into
          practice.
        annotations:
          study_theme: LF
        comments:
        - 'Sub-themes: verification and storage (LF.1) and two-party review for small projects (LF.2);
          219 issues.'
      UNCLEAR_RELEVANCE:
        description: Which attacks SLSA mitigates, and how it differs from other practices, is unclear.
        annotations:
          study_theme: UR
        comments:
        - 'Sub-theme: unclear scope and ecosystem-level inconsistencies (UR.1); 46 issues.'
    in_subset:
    - slsa_adoption_study
  SlsaAdoptionStrategy:
    description: The five themes of strategy practitioners proposed for the adoption challenges.
    see_also:
    - https://arxiv.org/abs/2409.05014
    permissible_values:
      ENHANCE_ALIGNMENT_FLEXIBILITY:
        description: Make SLSA fit more contexts, with build-system tracks, flexibility for varied organizations
          and alignment with OpenSSF practices.
        annotations:
          study_theme: S1
      PROVIDE_DETAILED_DOCUMENTATION:
        description: Give clearer definitions, standard terms, negative examples and better navigation.
        annotations:
          study_theme: S2
      STREAMLINE_PROVENANCE_GENERATION:
        description: Simplify and standardize provenance generation with tools and templates, and fix
          release-tool inconsistencies.
        annotations:
          study_theme: S3
      IMPROVE_VERIFICATION_PROCESS:
        description: Strengthen verification and level determination, tag versions early, and give downstream
          users more signals.
        annotations:
          study_theme: S4
      COLLABORATE_WITH_COMMUNITY:
        description: Align with industry standards, guide newcomers, and share knowledge across projects.
        annotations:
          study_theme: S5
    in_subset:
    - slsa_adoption_study
subsets:
  slsa_build_track:
    description: Elements of the SLSA Build track, which measures the trustworthiness of a build and its
      provenance.
  slsa_source_track:
    description: Elements of the SLSA Source track, which measures how source revisions are created and
      managed.
  slsa_dependency_track:
    description: Elements of the SLSA Dependency track, a working-draft track for managing risk from third-party
      dependencies.
  slsa_build_environment_track:
    description: Elements of the SLSA Build Environment track, a working-draft track for the integrity
      of the compute environment that runs builds.
  slsa_adoption_study:
    description: Elements this schema adds from an empirical study of SLSA adoption (Tamanna et al., 2024,
      arXiv:2409.05014). They are not part of the SLSA specification.
  slsa_ssf:
    description: Elements this schema adds from the CNCF TAG-Security Secure Software Factory reference
      architecture and the OpenSSF supply-chain projects. They are not part of the SLSA specification.
notes:
- 'Adapted for LOKF by `lokf adapt`. re-rooted on lokf:Concept: SlsaParty, SlsaBuildPlatform, SlsaControlPlane,
  SlsaPackageRegistry, SlsaPackage, SlsaSourceControlSystem, SlsaSourceRepository, SlsaSourceRevision,
  SlsaBuildImage; dropped for LOKF''s: builder_id, registry_uri, scs_uri, repository_uri, revision_id,
  image_uri; designators demoted: predicate_kind, party_type, reference_type.'
