---
id: https://w3id.org/lmodel/slsa/slsa_verification
name: slsa_verification
title: SLSA verification summary
description: >-
  The Verification Summary Attestation predicate
  (https://slsa.dev/verification_summary/v1): a trusted verifier's statement of
  the SLSA levels an artifact was verified at.
license: Apache-2.0
see_also:
  - https://slsa.dev/spec/v1.2/verification_summary

default_prefix: slsa
default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  slsa: https://w3id.org/lmodel/slsa/

imports:
  - linkml:types
  - ./slsa_core

types:
  slsa_result_value:
    typeof: string
    description: >-
      A result as a VSA writes it: one of the SLSA-defined results SlsaResult lists, or
      one of the issuer's own, which never starts with SLSA_.
    pattern: &slsa_result_pattern "^(SLSA_BUILD_LEVEL_(UNEVALUATED|[0-3])|SLSA_SOURCE_LEVEL_(UNEVALUATED|[0-4])|SLSA_SOURCE_TWO_PARTY_REVIEWED|SLSA_BUILD_REPRODUCED|([!-RT-rt-~]|[Ss]$|[Ss][!-KM-km-~]|[Ss][Ll]$|[Ss][Ll][!-RT-rt-~]|[Ss][Ll][Ss]$|[Ss][Ll][Ss][!-@B-`b-~]|[Ss][Ll][Ss][Aa]$|[Ss][Ll][Ss][Aa][!-^`-~])[!-~]*)$"
    see_also:
      - https://slsa.dev/spec/v1.2/verification_summary#slsaresult
    comments:
      - >-
        An issuer's own result, such as an organization's ORG_SOURCE_ property, is
        printable ASCII with no spaces and does not start with SLSA_ in any letter
        case, so that it cannot pass for an SLSA result.
    notes:
      - >-
        The pattern lists the values of SlsaResult that start with SLSA_ and then
        admits any other value that does not, written without a lookahead, which
        SHACL's regular expressions lack. One type in place of any_of over the enum
        and a pattern keeps the OWL output valid, since gen-owl makes the enum a class.
      - >-
        verified_levels and verified_level repeat the pattern through a YAML anchor,
        because gen-pydantic checks a slot's pattern but not its type's.
      - tests/test_schema_rules.py checks the pattern against SlsaResult.
    in_subset:
      - slsa_build_track
      - slsa_source_track

classes:
  SlsaVerificationSummary:
    is_a: SlsaPredicate
    description: >-
      The predicate in which a verifier records that it evaluated artifacts
      against a policy and the SLSA levels they met, so consumers can rely on
      the verifier instead of reading every underlying attestation.
    see_also:
      - https://slsa.dev/spec/v1.2/verification_summary
      - https://slsa.dev/spec/v1.2/source-requirements#source-verification-summary-attestation
    comments:
      - >-
        The statement that carries it has predicate_type
        https://slsa.dev/verification_summary/v1.
      - >-
        A Source VSA is this predicate with the repository as resource_uri and the
        revision id in the subject's digest.
      - >-
        Verification tooling and the places attestations are stored were an adoption
        difficulty practitioners reported (Tamanna et al., 2024, LF.1).
    slots:
      - resource_uri
    slot_usage:
      resource_uri:
        description: >-
          The URI consumers fetch the artifact from, which the verifier verified it as.
        required: true
    attributes:
      verifier:
        description: The verifier that made this determination.
        range: SlsaVerifier
        required: true
        inlined: true
      time_verified:
        description: When the verification happened.
        range: in_toto_timestamp
      policy:
        description: >-
          The policy the subject was verified against, by URI and preferably by digest
          too.
        range: SlsaVerificationSummaryPolicy
        required: true
        inlined: true
      input_attestations:
        description: >-
          Every attestation the verifier consulted, each with a digest; complete when
          present.
        range: SlsaVerificationSummaryInputAttestation
        multivalued: true
        inlined: true
        inlined_as_list: true
      verification_result:
        description: Whether the subject passed the policy.
        range: SlsaVerificationResult
        required: true
      verified_levels:
        description: >-
          The highest level verified in each track, any verified property, and any
          result of the issuer's own; a level implies the levels below it.
        range: slsa_result_value
        pattern: *slsa_result_pattern
        multivalued: true
        required: true
        minimum_cardinality: 1
        comments:
          - >-
            A VSA lists at most one level per track, and only FAILED when verification
            failed; the validator checks neither.
      organization_properties:
        description: >-
          Properties the organization defines for the revision, each prefixed
          ORG_SOURCE_; ORG_SOURCE_INTERNAL_ marks one not meant for external consumers.
        multivalued: true
        pattern: "^ORG_SOURCE_"
        deprecated: >-
          Write these properties in verified_levels, where the attestation's JSON puts
          them; this field goes in a later release.
        deprecated_element_has_possible_replacement: slsa:verified_levels
        in_subset:
          - slsa_source_track
      dependency_levels:
        description: >-
          How many transitive dependencies were verified at each level; absent when the
          verifier makes no claim about dependencies.
        range: SlsaDependencyLevelCount
        multivalued: true
        inlined: true
        inlined_as_list: true
        comments:
          - >-
            The attestation's JSON tells an empty map (no dependencies) from an absent
            one (no claim); this list cannot, so an empty list reads as no claim.
      slsa_version:
        description: >-
          The SLSA specification version the verifier applied, as MAJOR.MINOR.
        pattern: "^[0-9]+\\.[0-9]+$"
    in_subset:
      - slsa_build_track
      - slsa_source_track

  SlsaDependencyLevelCount:
    description: >-
      The number of an artifact's transitive dependencies verified at one level, each
      counted once per track at its highest level.
    comments:
      - >-
        Each level appears once in a list, since the attestation's JSON uses it as a
        key; the validator does not check this.
    attributes:
      verified_level:
        description: >-
          The level the dependencies were verified at, or a result of the issuer's own.
        range: slsa_result_value
        pattern: *slsa_result_pattern
        required: true
      dependency_count:
        description: How many dependencies were verified at that level.
        range: integer
        minimum_value: 0
        required: true
    in_subset:
      - slsa_build_track

  SlsaVerificationSummaryPolicy:
    is_a: InTotoResourceDescriptor
    description: >-
      The policy a verification summary applied: a resource descriptor that names the
      policy by URI.
    see_also:
      - https://slsa.dev/spec/v1.2/verification_summary#policy
    comments:
      - A digest is recommended as well, to pin the exact version of the policy.
    slot_usage:
      resource_uri:
        required: true
      digest:
        recommended: true
    in_subset:
      - slsa_build_track
      - slsa_source_track

  SlsaVerificationSummaryInputAttestation:
    is_a: InTotoResourceDescriptor
    description: >-
      One attestation a verifier consulted: a resource descriptor that carries the
      attestation's digest.
    see_also:
      - https://slsa.dev/spec/v1.2/verification_summary#inputAttestations
    slot_usage:
      digest:
        required: true
      resource_uri:
        recommended: true
    in_subset:
      - slsa_build_track
      - slsa_source_track

enums:
  SlsaVerificationResult:
    description: The outcome of verifying an artifact against a policy.
    permissible_values:
      PASSED:
        description: The artifact met the policy.
      FAILED:
        description: The artifact did not meet the policy.
    in_subset:
      - slsa_build_track
      - slsa_source_track

  SlsaResult:
    description: >-
      A result of evaluating an artifact against SLSA: a track level, a
      verified property, or a failure. A level implies the levels below it in
      the same track.
    see_also:
      - https://slsa.dev/spec/v1.2/verification_summary#slsaresult
      - https://slsa.dev/spec/v1.2/verified-properties
    comments:
      - >-
        Issuers may add values of their own, but none that start with SLSA_; this enum
        lists the SLSA-defined values, and slsa_result_value, which verified_levels
        takes, admits both.
      - >-
        The working-draft Dependency and Build Environment tracks name no results yet,
        so none are listed for them.
    permissible_values:
      SLSA_BUILD_LEVEL_UNEVALUATED:
        description: The issuer makes no claim about the Build track level.
      SLSA_BUILD_LEVEL_0:
        description: No Build track guarantees were verified.
      SLSA_BUILD_LEVEL_1:
        description: Build level 1 was verified.
      SLSA_BUILD_LEVEL_2:
        description: Build level 2 was verified.
      SLSA_BUILD_LEVEL_3:
        description: Build level 3 was verified.
      SLSA_SOURCE_LEVEL_UNEVALUATED:
        description: The issuer makes no claim about the Source track level.
      SLSA_SOURCE_LEVEL_0:
        description: No Source track guarantees were verified.
      SLSA_SOURCE_LEVEL_1:
        description: Source level 1 was verified.
      SLSA_SOURCE_LEVEL_2:
        description: Source level 2 was verified.
      SLSA_SOURCE_LEVEL_3:
        description: Source level 3 was verified.
      SLSA_SOURCE_LEVEL_4:
        description: Source level 4 was verified.
      SLSA_SOURCE_TWO_PARTY_REVIEWED:
        description: >-
          The verified property that two trusted persons reviewed the source, at
          whatever source level.
      SLSA_BUILD_REPRODUCED:
        description: >-
          The verified property that two or more independent build platforms reproduced
          the artifact.
      FAILED:
        description: Policy evaluation failed.
    in_subset:
      - slsa_build_track
      - slsa_source_track
