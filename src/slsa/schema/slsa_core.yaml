---
id: https://w3id.org/lmodel/slsa/slsa_core
name: slsa_core
title: SLSA core
description: >-
  The parts of the SLSA model that every track shares: the base of SLSA's
  predicates and the fields SLSA adds to an in-toto statement, the
  supply-chain roles, the build platform and the package model. The in-toto
  attestation layer itself comes from lmodel/in-toto's core module.
license: Apache-2.0
see_also:
  - https://slsa.dev/spec/v1.2/terminology
  - https://slsa.dev/spec/v1.2/attestation-model

default_prefix: slsa
default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  slsa: https://w3id.org/lmodel/slsa/

imports:
  - linkml:types
  - ./in_toto/in_toto_core

subsets:
  slsa_build_track:
    description: >-
      Elements of the SLSA Build track, which measures the trustworthiness of a build
      and its provenance.
  slsa_source_track:
    description: >-
      Elements of the SLSA Source track, which measures how source revisions are created
      and managed.
  slsa_dependency_track:
    description: >-
      Elements of the SLSA Dependency track, a working-draft track for managing risk
      from third-party dependencies.
  slsa_build_environment_track:
    description: >-
      Elements of the SLSA Build Environment track, a working-draft track for the
      integrity of the compute environment that runs builds.
  slsa_adoption_study:
    description: >-
      Elements this schema adds from an empirical study of SLSA adoption
      (Tamanna et al., 2024, arXiv:2409.05014). They are not part of the SLSA
      specification.
  slsa_ssf:
    description: >-
      Elements this schema adds from the CNCF TAG-Security Secure Software
      Factory reference architecture and the OpenSSF supply-chain projects. They
      are not part of the SLSA specification.

slots:
  component_versions:
    description: The version of each named component of a platform.
    slot_uri: slsa:component_versions
    range: SlsaComponentVersion
    multivalued: true
    inlined: true
    inlined_as_list: true
    in_subset:
      - slsa_build_track

  ecosystem:
    description: >-
      The package ecosystem whose rules govern how a package is named and distributed,
      such as PyPA, npm or OCI.
    slot_uri: slsa:ecosystem
    comments:
      - >-
        One ecosystem's tools can name the same package differently, which the study
        found affects attestations and provenance, so verifiers match provenance to
        package names with care (Tamanna et al., 2024, UR.1).
    in_subset:
      - slsa_build_track
      - slsa_dependency_track

  build_platform:
    description: The build platform this party or component belongs to or uses.
    slot_uri: slsa:build_platform
    range: SlsaBuildPlatform
    in_subset:
      - slsa_build_track

classes:
  # ── Attestation layer ────────────────────────────────────────────────────

  SlsaStatement:
    is_a: InTotoStatement
    description: >-
      An in-toto statement with the fields this schema adds: where the signed
      attestation is stored, the tool that signed it and the transparency log
      entry that records the signature.
    see_also:
      - https://slsa.dev/spec/v1.2/attestation-model
      - https://slsa.dev/spec/v1.2/distributing-provenance
    comments:
      - >-
        InTotoStatement comes from lmodel/in-toto and holds only what the in-toto
        specification defines, so the fields SLSA's adoption study and the Secure
        Software Factory add live on this subclass. A statement without them is a
        valid SlsaStatement too.
      - >-
        Attestation and provenance are often confused; a statement is the attestation,
        and build provenance is one kind of predicate it may carry (Tamanna et al.,
        2024, UC.1).
    attributes:
      attestation_storage_uri:
        description: Where the signed attestation is stored or can be fetched.
        range: uri
        comments:
          - >-
            SLSA asks producers to publish attestations in at least one place and
            preferably more: beside the source repository's releases, beside the
            artifact in its package registry, which it prefers in the long term, or
            elsewhere with an entry in a transparency log.
          - >-
            Where to store attestations was an open question for practitioners
            (Tamanna et al., 2024, LF.1).
        in_subset:
          - slsa_adoption_study
      signing_tool:
        description: >-
          The tool that signed the attestation, named by URI, such as Cosign or
          Notation.
        range: uri
        in_subset:
          - slsa_ssf
      transparency_log_entry:
        description: >-
          The transparency log entry that records the signature, such as a Rekor entry.
        range: uri
        in_subset:
          - slsa_ssf
    in_subset:
      - slsa_build_track
      - slsa_source_track
      - slsa_build_environment_track

  SlsaPredicate:
    is_a: InTotoPredicate
    abstract: true
    description: >-
      The base of every predicate this schema models; the predicate_kind it takes from
      InTotoPredicate names the concrete kind.
    in_subset:
      - slsa_build_track
      - slsa_source_track
      - slsa_build_environment_track

  # ── Roles ────────────────────────────────────────────────────────────────

  SlsaParty:
    abstract: true
    description: >-
      A person or organization that takes part in a software supply chain, in one of the
      roles SLSA names.
    see_also:
      - https://slsa.dev/spec/v1.2/terminology#roles
    comments:
      - One party may act in several roles, and several parties may share one role.
    attributes:
      party_type:
        description: The role the party acts in, one of this class's descendants.
        designates_type: true
        range: string
      party_name:
        description: The party's name.
    in_subset:
      - slsa_build_track
      - slsa_source_track

  SlsaProducer:
    is_a: SlsaParty
    description: >-
      A party that creates software and provides it to others, choosing a build platform
      and distributing provenance.
    slots:
      - build_platform
    in_subset:
      - slsa_build_track

  SlsaConsumer:
    is_a: SlsaParty
    description: >-
      A party that uses software a producer provides, verifying its provenance itself or
      through a verifier.
    in_subset:
      - slsa_build_track
      - slsa_source_track

  SlsaVerifier:
    is_a: SlsaParty
    description: >-
      A party that inspects provenance or other attestations and decides whether an
      artifact is authentic.
    see_also:
      - https://slsa.dev/spec/v1.2/verification_summary#verifier
    comments:
      - Consumers accept only specific signer and verifier pairs.
    slots:
      - component_versions
    attributes:
      verifier_id:
        description: The URI that identifies the verifier.
        range: in_toto_type_uri
        required: true
    in_subset:
      - slsa_build_track
      - slsa_source_track

  SlsaInfrastructureProvider:
    is_a: SlsaParty
    description: >-
      A party that provides software or services to the other roles, such as a package
      registry's or a build platform's maintainers.
    in_subset:
      - slsa_build_track
      - slsa_source_track

  # ── Build model ──────────────────────────────────────────────────────────

  SlsaBuildPlatform:
    description: >-
      The system that runs builds and records their provenance: the transitive
      closure of software, hardware, people and organizations trusted to do so.
      Provenance names it as the builder.
    see_also:
      - https://slsa.dev/spec/v1.2/terminology#build-model
      - https://slsa.dev/spec/v1.2/build-provenance#builder
    comments:
      - >-
        A platform with several modes of operation at different levels has a different
        builder_id for each.
    slots:
      - component_versions
    attributes:
      builder_id:
        identifier: true
        description: >-
          The URI that identifies the platform and determines its SLSA Build level.
        range: in_toto_type_uri
      build_level:
        description: The highest SLSA Build level the platform's provenance can meet.
        range: SlsaBuildLevel
      hosted:
        description: >-
          Whether the platform is a hosted service on shared or dedicated infrastructure
          rather than an individual's workstation.
        range: boolean
        comments:
          - Build L2 and above require a hosted platform.
      builder_dependencies:
        description: >-
          Dependencies of the platform's orchestrator that do not run inside the build
          but may affect provenance generation or its guarantees.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
    in_subset:
      - slsa_build_track

  SlsaControlPlane:
    description: >-
      The component of a build platform that orchestrates each build and generates its
      provenance, outside the tenant's control.
    see_also:
      - https://slsa.dev/spec/v1.2/terminology#build-model
    slots:
      - build_platform
    in_subset:
      - slsa_build_track

  SlsaComponentVersion:
    description: The version of one named component of a platform.
    comments:
      - >-
        Each component appears once in a list, since the attestation's JSON uses its
        name as a key; the validator does not check this.
    attributes:
      component:
        description: The component's name.
        required: true
      component_version:
        description: The component's version string.
    in_subset:
      - slsa_build_track

  # ── Distribution model ───────────────────────────────────────────────────

  SlsaPackageRegistry:
    description: >-
      A distribution platform that resolves package names to immutable package artifacts
      within an ecosystem.
    see_also:
      - https://slsa.dev/spec/v1.2/terminology#distribution-model
    slots:
      - ecosystem
    attributes:
      registry_uri:
        identifier: true
        description: The URI that identifies the registry.
        range: uri
    in_subset:
      - slsa_build_track
      - slsa_dependency_track

  SlsaPackage:
    description: >-
      A unit of software distributed under a package name, which is the primary
      security boundary SLSA protects. Its artifacts are the outputs of builds.
    see_also:
      - https://slsa.dev/spec/v1.2/terminology#distribution-model
    slots:
      - ecosystem
    attributes:
      package_name:
        description: >-
          The name consumers use to obtain the package within its ecosystem and
          registry.
        required: true
      registry:
        description: The registry the package is published to.
        range: SlsaPackageRegistry
      package_artifacts:
        description: The immutable artifacts the package name has resolved to.
        range: InTotoResourceDescriptor
        multivalued: true
        inlined: true
        inlined_as_list: true
      guac_uri:
        description: >-
          Where a GUAC instance answers queries about the package's dependency and
          provenance graph.
        range: uri
        in_subset:
          - slsa_ssf
      security_insights_uri:
        description: >-
          The SECURITY-INSIGHTS.yml file of the project that produces the package.
        range: uri
        in_subset:
          - slsa_ssf
    in_subset:
      - slsa_build_track
      - slsa_dependency_track

enums:
  SlsaBuildLevel:
    description: >-
      The levels of the SLSA Build track, each adding protection against tampering with
      the build or its provenance.
    see_also:
      - https://slsa.dev/spec/v1.2/build-track-basics
    permissible_values:
      SLSA_BUILD_LEVEL_0:
        description: >-
          No requirements; the absence of SLSA, as for development or test builds.
      SLSA_BUILD_LEVEL_1:
        description: >-
          Provenance exists and shows how the package was built; it prevents mistakes
          but is easy to forge.
      SLSA_BUILD_LEVEL_2:
        description: >-
          A hosted platform generates and signs the provenance, so tampering after the
          build needs an explicit attack.
        comments:
          - >-
            Keeping the provenance generator, the verifier and signing tools such as
            cosign working in CI workflows was a common difficulty (Tamanna et al.,
            2024, CI.2).
      SLSA_BUILD_LEVEL_3:
        description: >-
          A hardened platform prevents runs from influencing one another and keeps
          signing material away from build steps, so forging provenance needs an
          exploit.
        comments:
          - >-
            Practitioners reported difficulty in generating provenance for the higher
            levels (Tamanna et al., 2024, CI.1).
    in_subset:
      - slsa_build_track
