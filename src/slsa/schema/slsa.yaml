---
id: https://w3id.org/lmodel/slsa
name: slsa
title: Supply-chain Levels for Software Artifacts (SLSA)
description: >-
  A LinkML model of the SLSA specification: its tracks and levels, the roles
  and systems in a software supply chain, and the in-toto attestations that
  carry build provenance and verification summaries.
version: 1.2.0
source: https://slsa.dev/spec/v1.2
license: Apache-2.0
see_also:
  - https://lmodel.github.io/slsa
  - https://slsa.dev/spec/v1.2/
  - https://github.com/slsa-framework/slsa
comments:
  - >-
    The version is the SLSA specification version the model renders. The Dependency and
    Build Environment tracks follow the working draft at that version, which the release
    does not include.
  - >-
    slsa_core imports only the LinkML types, each track module imports the core, and
    this file adds only the document root, so an importer can take one module.

default_prefix: slsa
default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  slsa: https://w3id.org/lmodel/slsa/

imports:
  - linkml:types
  - ./slsa_core
  - ./slsa_build
  - ./slsa_verification
  - ./slsa_source
  - ./slsa_dependency
  - ./slsa_build_environment
  - ./slsa_adoption

classes:
  SlsaDocument:
    tree_root: true
    description: >-
      A document that holds SLSA attestations and the parties, platforms, packages,
      repositories and images they concern.
    attributes:
      attestations:
        description: The attestations, as in-toto statements.
        range: InTotoStatement
        multivalued: true
        inlined: true
        inlined_as_list: true
      parties:
        description: The parties, each in its role.
        range: SlsaParty
        multivalued: true
        inlined: true
        inlined_as_list: true
      build_platforms:
        description: The build platforms.
        range: SlsaBuildPlatform
        multivalued: true
        inlined: true
        inlined_as_list: true
      packages:
        description: The packages.
        range: SlsaPackage
        multivalued: true
        inlined: true
        inlined_as_list: true
      package_registries:
        description: The package registries.
        range: SlsaPackageRegistry
        multivalued: true
        inlined: true
        inlined_as_list: true
      source_control_systems:
        description: The source control systems.
        range: SlsaSourceControlSystem
        multivalued: true
        inlined: true
        inlined_as_list: true
      source_repositories:
        description: The source repositories.
        range: SlsaSourceRepository
        multivalued: true
        inlined: true
        inlined_as_list: true
      source_revisions:
        description: The source revisions.
        range: SlsaSourceRevision
        multivalued: true
        inlined: true
        inlined_as_list: true
      named_references:
        description: The branches and tags.
        range: SlsaNamedReference
        multivalued: true
        inlined: true
        inlined_as_list: true
      build_images:
        description: The build images.
        range: SlsaBuildImage
        multivalued: true
        inlined: true
        inlined_as_list: true
      dependency_inventories:
        description: The dependency inventories.
        range: SlsaDependencyInventory
        multivalued: true
        inlined: true
        inlined_as_list: true
      adoption_metadata:
        description: >-
          How the deployment the document describes fares against the adoption study's
          themes.
        range: SlsaAdoptionMetadata
        inlined: true
