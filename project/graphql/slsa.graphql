    runDetails: SlsaRunDetails!
  }

type SlsaComponentVersion
  {
    component: String!
    componentVersion: String
  }

type SlsaConsumer
  {
    partyType: String
    partyName: String
  }

type SlsaControlPlane
  {
    buildPlatform: SlsaBuildPlatform
  }

type SlsaDependencyInventory
  {
    artifact: InTotoResourceDescriptor!
    dependencies: [InTotoResourceDescriptor]
    dependencyLevel: SlsaDependencyLevel
  }

type SlsaDependencyLevelCount
  {
    verifiedLevel: SlsaResultValue!
    dependencyCount: Int!
  }

type SlsaDocument
  {
    attestations: [SlsaStatement]
    parties: [SlsaParty]
    buildPlatforms: [SlsaBuildPlatform]
    controlPlanes: [SlsaControlPlane]
    packages: [SlsaPackage]
    packageRegistries: [SlsaPackageRegistry]
    sourceControlSystems: [SlsaSourceControlSystem]
    sourceRepositories: [SlsaSourceRepository]
    sourceRevisions: [SlsaSourceRevision]
    namedReferences: [SlsaNamedReference]
    buildImages: [SlsaBuildImage]
    dependencyInventories: [SlsaDependencyInventory]
    adoptionMetadata: SlsaAdoptionMetadata
  }

type SlsaInfrastructureProvider
  {
    partyType: String
    partyName: String
  }

type SlsaMeasurement
  {
    digest: InTotoDigestSet
    measuredComponent: String!
  }

type SlsaNamedReference
  {
    repository: SlsaSourceRepository
    revision: SlsaSourceRevision
    referenceType: String
    referenceName: String!
    protected: Boolean
  }

type SlsaPackage
  {
    ecosystem: String
    packageName: String!
    registry: SlsaPackageRegistry
    packageArtifacts: [InTotoResourceDescriptor]
    guacUri: String
    securityInsightsUri: String
  }

type SlsaPackageRegistry
  {
    ecosystem: String
    registryUri: String!
  }

interface SlsaParty
  {
    partyType: String
    partyName: String
  }

interface SlsaPredicate
  {
    predicateKind: String
  }

type SlsaProducer
  {
    partyType: String
    partyName: String
    buildPlatform: SlsaBuildPlatform
  }

type SlsaRunDetails
  {
    builder: SlsaBuildPlatform!
    buildMetadata: SlsaBuildMetadata
