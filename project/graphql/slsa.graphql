# metamodel_version: 1.12.0
# version: 1.2.0
enum SlsaAdoptionChallenge
  {
    COMPLEX_IMPLEMENTATION
    UNCLEAR_COMMUNICATION
    LIMITED_FEASIBILITY
    UNCLEAR_RELEVANCE
  }

enum SlsaAdoptionStrategy
  {
    ENHANCE_ALIGNMENT_FLEXIBILITY
    PROVIDE_DETAILED_DOCUMENTATION
    STREAMLINE_PROVENANCE_GENERATION
    IMPROVE_VERIFICATION_PROCESS
    COLLABORATE_WITH_COMMUNITY
  }

enum SlsaBuildEnvironmentLevel
  {
    SLSA_BUILD_ENV_LEVEL_0
    SLSA_BUILD_ENV_LEVEL_1
    SLSA_BUILD_ENV_LEVEL_2
    SLSA_BUILD_ENV_LEVEL_3
  }

enum SlsaBuildLevel
  {
    SLSA_BUILD_LEVEL_0
    SLSA_BUILD_LEVEL_1
    SLSA_BUILD_LEVEL_2
    SLSA_BUILD_LEVEL_3
  }

enum SlsaDependencyLevel
  {
    SLSA_DEPENDENCY_LEVEL_0
    SLSA_DEPENDENCY_LEVEL_1
    SLSA_DEPENDENCY_LEVEL_2
    SLSA_DEPENDENCY_LEVEL_3
    SLSA_DEPENDENCY_LEVEL_4
  }

enum SlsaResult
  {
    SLSA_BUILD_LEVEL_UNEVALUATED
    SLSA_BUILD_LEVEL_0
    SLSA_BUILD_LEVEL_1
    SLSA_BUILD_LEVEL_2
    SLSA_BUILD_LEVEL_3
    SLSA_SOURCE_LEVEL_UNEVALUATED
    SLSA_SOURCE_LEVEL_0
    SLSA_SOURCE_LEVEL_1
    SLSA_SOURCE_LEVEL_2
    SLSA_SOURCE_LEVEL_3
    SLSA_SOURCE_LEVEL_4
    SLSA_SOURCE_TWO_PARTY_REVIEWED
    SLSA_BUILD_REPRODUCED
    FAILED
  }

enum SlsaReviewType
  {
    TWO_PARTY
    PAIR_PROGRAMMING
    MOB_PROGRAMMING
    AUTOMATED
  }

enum SlsaSourceLevel
  {
    SLSA_SOURCE_LEVEL_0
    SLSA_SOURCE_LEVEL_1
    SLSA_SOURCE_LEVEL_2
    SLSA_SOURCE_LEVEL_3
    SLSA_SOURCE_LEVEL_4
  }

enum SlsaVerificationResult
  {
    PASSED
    FAILED
  }

type InTotoAdditionalDigest
  {
    algorithm: String!
    value: String!
  }

type InTotoAnnotation
  {
    annotationKey: String!
    annotationValues: [String]
  }

type InTotoDigestSet
  {
    sha256: String
    sha224: String
    sha384: String
    sha512: String
    sha512224: String
    sha512256: String
    sha3224: String
    sha3256: String
    sha3384: String
    sha3512: String
    shake128: String
    shake256: String
    blake2b: String
    blake2s: String
    ripemd160: String
    sm3: String
    gost: String
    sha1: String
    md5: String
    dirHash: String
    gitCommit: String
    gitTree: String
    gitBlob: String
    gitTag: String
    additionalDigests: [InTotoAdditionalDigest]
  }

interface InTotoPredicate
  {
    predicateKind: String
  }

type InTotoResourceDescriptor
  {
    resourceUri: InTotoResourceUri
    digest: InTotoDigestSet
    resourceName: String
    downloadLocation: InTotoResourceUri
    mediaType: String
    content: String
    annotations: [InTotoAnnotation]
  }

type InTotoStatement
  {
    predicate: InTotoPredicate
    statementType: InTotoTypeUri!
    subject: [InTotoStatementSubject]!
    predicateType: InTotoTypeUri!
  }

type InTotoStatementSubject
  {
    resourceUri: InTotoResourceUri
    resourceName: String
    downloadLocation: InTotoResourceUri
    mediaType: String
    content: String
    annotations: [InTotoAnnotation]
    digest: InTotoDigestSet!
  }

type SlsaAdoptionMetadata
  {
    challenges: [SlsaAdoptionChallenge]
    strategies: [SlsaAdoptionStrategy]
  }

type SlsaBranch
  {
    repository: SlsaSourceRepository
    revision: SlsaSourceRevision
    referenceType: String
    referenceName: String!
    protected: Boolean
  }

type SlsaBuildDefinition
  {
    buildType: String!
    externalParameters: [SlsaBuildParameter]!
    internalParameters: [SlsaBuildParameter]
    resolvedDependencies: [InTotoResourceDescriptor]
    hermetic: Boolean
    provenanceGenerationTool: String
    pipelineOrchestrator: String
  }

type SlsaBuildEnvironmentAttestation
  {
    predicateKind: String
    buildEnvLevel: SlsaBuildEnvironmentLevel
    buildId: String!
    buildImage: SlsaBuildImage
    measurements: [SlsaMeasurement]
  }

type SlsaBuildImage
  {
    buildEnvLevel: SlsaBuildEnvironmentLevel
    imageUri: String!
    provenance: SlsaBuildProvenance
    producedBy: SlsaBuildImageProducer
  }

type SlsaBuildImageProducer
  {
    partyType: String
    partyName: String
  }

type SlsaBuildMetadata
  {
    invocationId: String
    startedOn: String
    finishedOn: String
  }

type SlsaBuildParameter
  {
    parameterName: String!
    parameterValue: String
  }

type SlsaBuildPlatform
  {
    componentVersions: [SlsaComponentVersion]
    builderId: String!
    buildLevel: SlsaBuildLevel
    hosted: Boolean
    builderDependencies: [InTotoResourceDescriptor]
  }

type SlsaBuildProvenance
  {
    predicateKind: String
