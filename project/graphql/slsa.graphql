  }

type SlsaSourceRevision
  {
    repository: SlsaSourceRepository
    revisionId: String!
    authoredBy: String
    authoredAt: String
    parentRevisions: [SlsaSourceRevision]
    sourceLevel: SlsaSourceLevel
    reviewType: SlsaReviewType
  }

type SlsaStatement
  {
    predicate: InTotoPredicate
    statementType: InTotoTypeUri!
    subject: [InTotoStatementSubject]!
    predicateType: InTotoTypeUri!
    attestationStorageUri: String
    signingTool: String
    transparencyLogEntry: String
  }

